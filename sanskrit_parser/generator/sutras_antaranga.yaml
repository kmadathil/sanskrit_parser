# 124.1: अनुस्वारस्य ययि परसवर्णः — variant for M embedded in penultimate (ll) position.
# Fires when M is at ll (last of lc) and a consonant is at l (e.g. after numAgama+8.3.24
# on añc-stems: numAgama inserts n; 8.3.24 converts n→M in lc, leaving c at l).
# xform: replace M (last of lc) with anunasika(l) — the class nasal of the following consonant.
# E.g.: lc="pratyaM", l="c" → anunasika("c")="Y" → lc="pratyaY", l="c" → "pratyaYc" = pratyañc ✓
- sutra: अनुस्वारस्य ययि परसवर्णः
