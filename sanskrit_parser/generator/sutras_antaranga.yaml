# 502: वोतो गुणवचनात् (4.1.44) — u-final quality word → optional NIz.
# मृद्वी (fire; u→v before ī by 6.1.77) / मृदुः (skip → plain u-stem).
- sutra: वोतो गुणवचनात्
  domain: prakfti
  bahiranga: 2
  id: 4.1.44
  optional: true
  condition:
     lp: ?guRavacana
     l: u
     rp: ?strI_abs
  update:
