# 234 : अल्लोपोऽनः (6-4-134)
# 234: अल्लोपोऽनः (6-4-134)
# `ll: at` (pratyāhāra) restricts the al-lopa to the SHORT अ that अल् names.
# isSavarna('at', 'a')=True, isSavarna('at', 'A')=False — so the long आ of the
# आनुक् augment (SK505, इन्द्रान्) is not affected. All genuine an-stems
# (rājan, takṣan, ahan, …) have a short-a penult → correctly matched.
- sutra: अल्लोपोऽनः
  id: 6.4.134
  overrides: 8.4.46
  condition:
     lp:
       - and
       - ?aNga
       - ?Ba
     ll: at
     l: n
  xform:
     lc: lc[:-1]
     l: null
  insert:
     l:  str("n")

# 679/6.4.144: नस्तद्धिते (6-4-144) — the ṭi (final vowel + न्) of a नकारान्त aṅga
# drops before a taddhita affix. For the avyayībhāva samāsānta उपराजम् the TaC
# (wac, ?tadDita) follows rājan → the ṭि अन् drops → rāj, then + टच् अ → rāja
# (a-stem) → 2.4.83 अम् → उपराजम्. Overrides the an-ablaut 6.4.134 (rājñ) in the
# taddhita context.
#
# Scope = ?Ba (bha-saṁjñā), NOT a stem marker: 6.4.144 sits in the भस्य adhikāra
# (6.4.129 भस्य), so it applies only when the aṅga is भ — i.e. before a य्- or
# अच्-initial affix (1.4.18 यचि भम्). This is general (any नकारान्त bha, ll: _ac)
# yet correctly EXCLUDES yuvan + ति (SK531): ति is consonant-initial, so yuvan is
# NOT bha → 6.4.144 does not fire, and the न् drops instead by 8.2.7 नलोपः
# प्रातिपदिकान्तस्य (न्-only) → युवति → युवती. The vowel-initial TaC (wac) DOES make
# rājan/carman/van bha, so 6.4.144 applies to those. (van, the 6.4.148 यस्येति-च
# transient from vana, is likewise bha before wac; it is kept out via the 6.4.22
# ābhīya asiddhavat edge 6.4.144→6.4.148 in antaranga_prakriya._ASIDDHA_PEERS.)
- sutra: नस्तद्धिते
  id: 6.4.144
  overrides: 6.4.134
  condition:
     lp:
       - and
       - ?aNga
       - ?Ba
     ll: _ac
     l: n
     rp: ?tadDita
  xform:
     lc: lc[:-1]
     l: null

# 6.4.145 अह्नष्टखोरेव (SK789) — niyama restricting 6.4.144 for ahan: the ṭi-lopa of
# अहन् happens ONLY (एव) before a ट- or ख-it taddhita. So for any OTHER taddhita
# (rp neither ?wa=टच्-class nor ?Ka), 6.4.145 fires and OVERRIDES (suppresses)
# 6.4.144, keeping the न् — the a-lopa 6.4.134 (अल्लोपोऽनः) then runs instead
# (ahan → ahn), so dvi+ahan+wac → द्व्यह्न (not द्व्यह). Pure niyama-blocker
# (xform: null); mirrors 6.4.144's (…न् | taddhita) window so the override lands
# on the same slot. wac (टच्) is NOT tagged ?wa here, so the samāsānta path keeps
# the न्; a genuinely ट/ख-marked taddhita would fail ?!wa/?!Ka and let 6.4.144 run.
- sutra: अह्नष्टखोरेव
  id: 6.4.145
  overrides: 6.4.144
  condition:
     lp:
       - and
       - ?aNga
       - ?Ba
       - =ahan
     ll: _ac
     l: n
     rp:
       - and
       - ?tadDita
       - ?!wa
       - ?!Ka
  xform: null

