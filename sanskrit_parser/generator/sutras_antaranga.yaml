# ════════════════════════════════════════════════════════════════════════════
# कारकप्रकरणम् (SK 532–646) — karaka_plan.md §2 conventions
#
# bahiranga: -2 is RESERVED for kāraka pre-pass rules (sentence-level tagging;
# AntarangaPrakriya._karaka_prepass runs exactly this class on the synthetic
# window lp = the noun, rp = the sentence's dhātu — NOT the physical
# neighbour; llp/rrp are the physical neighbour words). Never assign -2
# merely as a priority boost.
#
# bahiranga: -1 is RESERVED for samāsa pre-pass rules (compound formation;
# AntarangaPrakriya._samasa_prepass runs exactly this class AFTER the kāraka
# pre-pass + sup-insertion — samāsa combines padas-with-sup, सह सुपा 2.1.4).
# Lower = more antaraṅga = earlier: kāraka (-2) fixes vibhakti, samāsa (-1)
# consumes its output. See the avyayībhāva samāsa plan.
#
# Tag conventions:
#   - semantic_* : input primitives in the sutra wording (never kāraka names)
#   - kartari/karmaRi/BAve : prayoga tags on the pre-formed verb pada (SK536
#     anabhihite = reading these via rp); SK534 kArake = the pre-pass scope —
#     both adhikāras are engine semantics, no YAML entries.
#   - every kāraka-saṁjñā rule sets [+kAraka_x, +kAraka], guards "?!kAraka"
#     (1.4.1 ekā saṁjñā); conflicts resolve by 1.4.2 vipratiṣedhe param
#     (engine carve-out: both in 1.4.23–1.4.98 → higher aps wins).
#   - every vibhakti rule sets [+viBakti_N, +has_viBakti], guards
#     "?!has_viBakti". The guard is has_viBakti, NOT viBakti — the sup
#     pratyayas already carry a bare ?viBakti tag.
#   - ?tag inside [and, …] flow lists must be quoted.
# ════════════════════════════════════════════════════════════════════════════

