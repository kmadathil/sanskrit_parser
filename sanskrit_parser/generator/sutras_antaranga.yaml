  id: 4.1.24
  overrides: 4.1.21
  optional: true
  condition:
    lp:
      - and
      - ?dvigu
      - ?puruza
      - ?pramARe
      - ?luk_tadDita
    l: a
    rp: ?strI_abs
  update:
    orp: =NIp

# 483: ऊधसोऽनङ् (5.4.131)
# In a bahuvrīhi compound ending in ūdhas, anaṅ substitute in feminine.
# Surface: replace final 's' of UDas with 'n' (UDas → UDan). The pre-substitute
# 'a' stays, so SK234 (6.4.134 अल्लोपोऽनः) drops it before the ī of NIp/NIz
# at the next stage, giving the surface kuRqoDnI / dvyUDnI / etc.
# bahiranga: 1 (left prātipadika substitution) fires before SK484/485
# pratyaya selection (bahiranga: 2).
- sutra: ऊधसोऽनङ्
  domain: prakfti
  bahiranga: 1
  id: 5.4.131
  condition:
    lp:
      - and
      - ?bahuvrIhi
      - ?uDanta
    l: s
    rp: ?strI_abs
  xform:
    l: str("n")

# 484: बहुव्रीहेरूधसो ङीष् (4.1.25)
# After a bahuvrīhi ending in ūdhas (now ūdhan post-SK483), NIz in feminine.
# Overrides 4.1.4 (ṭāp) and 4.1.13 (ḍāp) — Vasu names these as the otherwise-
# applicable rules. The condition uses ?uDanta on lp; the tag still rides on
# UDas → UDan since SK483 only modifies the final char, not the tag set.
- sutra: बहुव्रीहेरूधसो ङीष्
  domain: prakfti
  bahiranga: 2
  id: 4.1.25
  overrides: [4.1.4, 4.1.13]
  condition:
    lp:
      - and
      - ?bahuvrIhi
      - ?uDanta
    rp: ?strI_abs
  update:
    orp: =NIz

# 485: संख्याऽव्ययादेर्ङीप् (4.1.26)
# Apavāda to SK484 (ngīṣopavāda): NIp instead of NIz when the bahuvrīhi
# begins with a saṃkhyā or an avyaya. The pūrva-pada class is read by peeking the
# left-neighbour pada: llp: ?saMKyA / llp: ?avyaya. These class tags are propagated
# from the pūrva-pada through its luk_sup merge (paninian_object.join_objects, gated
# on ?samAsaPurva, consumed at the samasta_pada merge) so the (uttara | strI_abs)
# window's llp carries them. Replaces the old fake ?saMKyAdi/?avyayAdi on the
# uttara-pada. Two arms (OR) — one per option.
- sutra: संख्याऽव्ययादेर्ङीप्
  domain: prakfti
  bahiranga: 2
  id: 4.1.26
  overrides: 4.1.25
  condition:
    - lp:
        - and
        - ?bahuvrIhi
        - ?uDanta
      llp: ?saMKyA
      rp: ?strI_abs
    - lp:
        - and
        - ?bahuvrIhi
        - ?uDanta
      llp: ?avyaya
      rp: ?strI_abs
  update:
    orp: =NIp

# 486: दामहायनान्ताच्च (4.1.27)
# Bahuvrīhi beginning with saṃkhyā and ending in दामन्/हायन: NIp in feminine.
# Two arms:
#   (a) dāman — no semantic restriction (द्विदाम्नी).
#   (b) hāyana — only the age sense (?vayasi) per Vasu's vārttika restriction;
#       non-age hāyana falls through to 4.1.4 ṭāp → द्विहायना शाला.
# Overrides 4.1.4 (ṭāp).
- sutra: दामहायनान्ताच्च
  domain: prakfti
  bahiranga: 2
  id: 4.1.27
  overrides: [4.1.4]
  condition:
    - lp:
        - and
        - ?bahuvrIhi
        - ?dAman
      llp: ?saMKyA
      rp: ?strI_abs
    - lp:
        - and
        - ?bahuvrIhi
        - ?hAyana
        - ?vayasi
      llp: ?saMKyA
      rp: ?strI_abs
  update:
    orp: =NIp

# 486+: (vārttika) त्रिचतुर्भ्यां हायनस्य णत्वं वयोवाचकस्यैव
# n → ṇ in hāyana when pūrva-pada is tri or catur AND the age (?vayasi) sense.
# Surface: lc of hAyana is "hAyan"; substitute lc[-1] 'n' → 'R' (ṇ), giving
# "hAyaR". After SK486 adds NIp and 6.4.148 drops the final 'a' →
# trihāyaṇī, caturhāyaṇī. The vārttika names tri/catur specifically, so it peeks
# the pūrva-pada identity (llp: [=tri, =catur]); SK486 itself uses the broader
# llp: ?saMKyA (the ?saMKyA tag is propagated to the neighbour in join_objects).
# bahiranga: 1 ensures n→ṇ runs before SK486 (NIp selection at 2).
- sutra: त्रिचतुर्भ्यां हायनस्य णत्वं वयोवाचकस्यैव
  domain: prakfti
  bahiranga: 1
  id: 4.1.27.1
  condition:
    lp:
      - and
      - ?bahuvrIhi
      - ?hAyana
      - ?vayasi
    llp: [=tri, =catur]
    rp: ?strI_abs
  xform:
    lc: lc[:-1]+str("R")

# 487: नित्यं संज्ञाछन्दसोः (4.1.29) — mandatory ṅīp on upadhā-lopin an-bahuvrīhi
# when used as a saṃjñā (name) or in chandas. Apavāda to SK462 (4.1.28), which
# made the same selection optional. ?saMjYA / ?Candas attached via test composer
# in_context. Reuses $$upaDAlopI from SK462. Overrides also 4.1.12 (niṣedha)
# and 4.1.13 (DAp) so only the ṅīp arm survives in saṃjñā/chandas → surAjJI,
# atirAjJI.
- sutra: नित्यं संज्ञाछन्दसोः
  domain: prakfti
  bahiranga: 2
  id: 4.1.29
  overrides: [4.1.4, 4.1.12, 4.1.13, 4.1.28]
  condition:
    - lp:
        - and
        - ?bahuvrIhi
        - $$upaDAlopI
        - ?saMjYA
      ll: a
      l: n
      rp: ?strI_abs
    - lp:
        - and
        - ?bahuvrIhi
        - $$upaDAlopI
        - ?Candas
      ll: a
      l: n
      rp: ?strI_abs
  update:
    orp: =NIp

# 488: केवलमामकभागधेयपापापरसमानार्यकृतसुमङ्गलभेषजाच्च (4.1.30) — mandatory NIp
# for the nine listed stems (?keval_Adi class tag) in saṃjñā or chandas.
# Apavāda to 4.1.4 (ṭāp). Vasu: केवली, मामकी, भागधेयी, पापी, अपरी, समानी,
# आर्यकृती, सुमङ्गली, भेषजी. Outside saṃjñā/chandas, default 4.1.4 ṭāp →
# केवला etc. (mAmaka takes SK463 7.3.44 idādeśa via ?ka_pratyaya → मामिका).
- sutra: केवलमामकभागधेयपापापरसमानार्यकृतसुमङ्गलभेषजाच्च
  domain: prakfti
  bahiranga: 2
  id: 4.1.30
  overrides: 4.1.4
  condition:
    - lp:
        - and
        - ?keval_Adi
        - ?saMjYA
      l: a
      rp: ?strI_abs
    - lp:
        - and
        - ?keval_Adi
        - ?Candas
      l: a
      rp: ?strI_abs
  update:
    orp: =NIp

# 488 niyama-blocker (vārttika मामकग्रहणं नियमार्थम्): outside saṃjñā/chandas,
# block SK470 (4.1.15) for mAmaka so the laukika ṭāp + SK463 idādeśa path runs
# → मामिका (not मामकी). Currently inert: mAmaka stem does not carry
# ?NIp_taddhita so SK470 is not a live competitor. Kept for forward
# compatibility when mAmaka is built live as mama + aN.
- sutra: मामकग्रहणं नियमार्थम्
  domain: prakfti
  bahiranga: 2
  id: 4.1.30.1
  overrides: 4.1.15
  condition:
    lp:
      - and
      - ?mAmaka
      - ?!saMjYA
      - ?!Candas
    l: a
    rp: ?strI_abs
  xform: null

# 490: पत्युर्नो यज्ञसंयोगे (4.1.33) — final 'i' of pati → 'n' before NIp when
# meaning yajña-saṃyoga (wife as sacrificial partner). Per Q2 deferral, the
# semantic restriction (?yajYasaMyoga) is not encoded — the rule fires
# unconditionally on plain pati. ?!samAsa restricts to non-compound contexts so
# SK491 (vibhāṣā for compounds) is not pre-empted. bahiranga: 1 → fires before
# SK453 (4.1.5) at bahiranga 2, which then adds NIp on the now n-final stem → पत्नी.
- sutra: पत्युर्नो यज्ञसंयोगे
  domain: prakfti
  bahiranga: 1
  id: 4.1.33
  condition:
    lp:
      - and
      - ?pati
      - ?!samAsa
    l: i
    rp: ?strI_abs
  xform:
    l: str("n")

# 491: विभाषा सपूर्वस्य (4.1.34) — i→n on pati when preceded by a pūrva-pada
# (pati as uttara-pada of a compound). Detection: in_compound(pati) pre-attaches
# ?samAsa at test-composer time (engine-limitation deferral note in plan — full
# pūrva-pada introspection awaits engine support). Implemented as mandatory in
# this batch (Vasu's vibhāṣā with the non-substituted गृहपतिः fork deferred):
# the non-substituted arm would yield a masc-style i-stem decl in feminine slot
# which the current engine generates as gRhapatiH etc., over-generating; we
# defer that variation rather than encode both forks in every cell.
- sutra: विभाषा सपूर्वस्य
  domain: prakfti
  bahiranga: 1
  id: 4.1.34
  condition:
    lp:
      - and
      - ?pati
      - ?samAsa
    l: i
    rp: ?strI_abs
  xform:
    l: str("n")

# 492: नित्यं सपत्न्यादिषु (4.1.35) — mandatory (nitya) i→n for the sapatnyAdi gaṇa
# (sa/eka/vīra + pati). Detects the gaṇa by peeking the pūrva-pada identity
# (llp: [=sa, =eka, =vIra]) on a live compound, instead of a pre-substituted
# ?sapatnyAdi stem; the समान→स niyama is the reduced pūrva-pada `sa` (sa_pUrva).
# Mirrors the 4.1.57 llp-peek precedent. Apavāda to SK491's vibhāṣā (4.1.34,
# compound pati): overrides 4.1.33/4.1.34 so the nitya substitution always wins.
- sutra: नित्यं सपत्न्यादिषु
  domain: prakfti
  bahiranga: 1
  id: 4.1.35
  overrides: [4.1.33, 4.1.34]
  condition:
    lp: ?pati
    llp: [=sa, =eka, =vIra]
    l: i
    rp: ?strI_abs
  xform:
    l: str("n")

# 489: अन्तर्वत्पतिवतोर्नुक् (4.1.32) — नुक् augment (single 'n') appended to
# antarvat / pativat before the feminine NIp. Engine-limitation deferral note
# in plan: stems are treated as single irregular pratipadikas tagged
# ?antarvat_pativat (not live antar+matup / pati+matup compounds). bahiranga: 1
# left-substitution appends 'n' at end (lc: lc+l+str("n"), l: null), so the
# resulting n-final stem reaches SK453 (4.1.5) at bahiranga: 2 → NIp → अन्तर्वत्नी,
# पतिवत्नी. Semantic restriction (?garBiNi / ?jIvadBartfka) not encoded.
- sutra: अन्तर्वत्पतिवतोर्नुक्
  domain: prakfti
  bahiranga: 1
  id: 4.1.32
  condition:
    lp: ?antarvat_pativat
    rp: ?strI_abs
  xform:
    lc: lc+l+str("n")
    l: null

# ── SK493–498: feminine-affix substitution cluster (4.1.36–41) ──────────────
# All select a strī affix at the (stem | strI_abs) window (bahiranga: 2). The
# ai/au substitutes (str("E")/str("O")) feed the existing 6.1.78 एचोऽयवायावः
# sandhi (E+ī→āyī, O+ī→āvī); 6.4.148 यस्येति च drops the final 'a' automatically.
# ṅīp vs ṅīṣ differ only by accent (not modelled) — both surface as ī.

# 493: पूतक्रतोरै च (4.1.36) — pūtakratu (live compound pūta + kratu) final u → ai
# (udātta) + NIp. Peeks the pūrva-pada (llp: =pUta) and reads the kratu uttara
# in-window (lp: =kratu); substitute final char (l→E) + select NIp in one rule
# (mirrors 4.1.7). puṃyoga ('wife of') restriction deferred (fires always).
- sutra: पूतक्रतोरै च
  domain: prakfti
  bahiranga: 2
  id: 4.1.36
  overrides: 4.1.4
  condition:
     llp: =pUta
     lp: =kratu
     rp: ?strI_abs
  xform:
     l: str("E")
  update:
     orp: =NIp

# 494: वृषाकप्यग्निकुसितकुसिदानामुदात्तः (4.1.37) — vṛṣākapi/agni/kusita/kusida
# final → ai (udātta) + NIp. → वृषाकपायी, अग्नायी, कुसितायी, कुसिदायी. (वृषाकपि kept as a
# single irregular ?vfzAkapyAdi stem — see pratipadika.py note.)
- sutra: वृषाकप्यग्निकुसितकुसिदानामुदात्तः
  domain: prakfti
  bahiranga: 2
  id: 4.1.37
  overrides: 4.1.4
  condition:
     lp: ?vfzAkapyAdi
     rp: ?strI_abs
  xform:
     l: str("E")
  update:
     orp: =NIp

# 495: मनोरौ वा (4.1.38) — manu final u → au (udātta) optionally + NIp → मनावी.
# Optional (वा): the non-fire branch leaves manu as a plain u-stem feminine
# (मनुः). No `overrides: 4.1.4` — 4.1.4 (ṭāp) cannot apply to the u-final manu
# anyway, and omitting it keeps the optional skip-branch clean (see SK496/SK482).
# The ai-variant (मनायी) is deferred.
- sutra: मनोरौ वा
  domain: prakfti
  bahiranga: 2
  id: 4.1.38
  optional: true
  condition:
     lp: ?manu
     rp: ?strI_abs
  xform:
     l: str("O")
  update:
     orp: =NIp

# 496: वर्णादनुदात्तात्तोपधात्तो नः (4.1.39) — colour word with त् as upadhā →
# optionally NIp, and त् → न्. The 'a'-final stem's upadhā 't' (lc[-1]) becomes
# 'n'; 6.4.148 then drops the final 'a' before ī → एनी; ṇatva (8.4.1) gives
# रोहिणी. Optional (वा): non-fire branch → 4.1.4 ṭāp → एता. NO `overrides: 4.1.4`
# — the engine disables an overridden rule in BOTH forks of an optional, so an
# override would strand the skip-branch with no affix (एतः). Instead SK496 wins
# the fire-branch by para-kāryam (higher _aps_num 41039 > 4.1.4's 41004), while
# the skip-branch lets 4.1.4 ṭāp fire → एता. (Same design as SK482.)
- sutra: वर्णादनुदात्तात्तोपधात्तो नः
  domain: prakfti
  bahiranga: 2
  id: 4.1.39
  optional: true
  condition:
     lp: ?varNa_topaDa
     l: a
     rp: ?strI_abs
  xform:
     lc: lc[:-1]+str("n")
  update:
     orp: =NIp

# 497: अन्यतो ङीष् (4.1.40) — every OTHER colour word (non-t-upadhā) → ṅīṣ.
# → सारङ्गी, कल्माषी, शबली (surface ī, same as NIp — accent only).
- sutra: अन्यतो ङीष्
  domain: prakfti
  bahiranga: 2
  id: 4.1.40
  overrides: 4.1.4
  condition:
     lp: ?varNa_anyatas
     rp: ?strI_abs
  update:
     orp: =NIz

# 498: षिद्गौरादिभ्यश्च (4.1.41) — ṣit-affixed stems (those carrying the ṣ it-marker,
# `lp: +z`) and gaurādi-gaṇa stems (?gaurAdi) → ṅīṣ. The ṣ it propagates from a
# ṣvun/ṣit affix to the merged stem via join_objects (1.2.46). → नर्तकी, गौरी, मत्सी.
- sutra: षिद्गौरादिभ्यश्च
  domain: prakfti
  bahiranga: 2
  id: 4.1.41
  overrides: 4.1.4
  condition:
     - lp: +z
       rp: ?strI_abs
     - lp: ?gaurAdi
       rp: ?strI_abs
  update:
     orp: =NIz

# ── SK500–505: ṅīṣ-selection continuation (4.1.42–45, 48, 49) ───────────────
# Tag-gated NIz selection (apavāda to 4.1.4 ṭāp), bahiranga 2. Optional rules
# (SK501/502/503) carry NO `overrides: 4.1.4` so the skip-fork falls through to
# ṭāp / u-stem (the SK495/496 two-fork design). Senses & vārttikas deferred.

# 500: जानपदकुण्डगोणस्थलभाजनागकालनीलकुशकामुककबरात् (4.1.42) — 11 listed stems →
# NIz in the listed senses. Senses not modelled; fires on ?jAnapadAdi → जानपदी,
# कुण्डी, गोणी (6.4.148 drops final 'a' before ī).
- sutra: जानपदकुण्डगोणस्थलभाजनागकालनीलकुशकामुककबरात्
  domain: prakfti
  bahiranga: 2
  id: 4.1.42
  overrides: 4.1.4
  condition:
     lp: ?jAnapadAdi
     rp: ?strI_abs
  update:
     orp: =NIz

# 501: शोणात्प्राचाम् (4.1.43) — śoṇa → optional NIz (Eastern grammarians).
# शोणी (fire) / शोणा (skip → 4.1.4 ṭāp).
- sutra: शोणात्प्राचाम्
  domain: prakfti
  bahiranga: 2
  id: 4.1.43
  optional: true
  condition:
     lp: ?SoRa
     rp: ?strI_abs
  update:
