  bahiranga: 2   # strīpratyaya selection = pratyaya substitution
  id: 4.1.22
  overrides: 4.1.21
  condition:
    - lp:
        - and
        - ?dvigu
        - ?luk_tadDita
        - ?!parimARa
        - ?!kARqa
      l: a
      rp: ?strI_abs
    - lp:
        - and
        - ?dvigu
        - ?luk_tadDita
        - ?bistAdi
      l: a
      rp: ?strI_abs
  update:
    olp: +TAp_added
    orp: =Ap

# 481: काण्डान्तात्क्षेत्रे (4-1-23)
# Niyama on SK480 for kāṇḍa-final Dvigus: select ṭāp (block ṅīp) only when the
# compound denotes a kṣetra (field). The non-kṣetra sense falls through to
# SK479 → ṅīp (द्विकाण्डी रज्जुः). The semantic ?kzetre tag is attached by the
# test composer via in_context(..., "kzetre") and rides through samāsa
# propagation to the compound stem. Vasu's example: द्विकाण्डा क्षेत्रभक्तिः.
- sutra: काण्डान्तात्क्षेत्रे
