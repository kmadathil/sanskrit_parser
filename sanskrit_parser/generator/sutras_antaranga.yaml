# पूर्वपरयोः (6.1.84 ekaḥ pūrvaparayoḥ) ekādeśa section, governed by the
# pariBAzA 6.1.85 अन्तादिवच्च (antādivat): the single substitute behaves as the
# final (anta) of pūrva AND the initial (ādi) of para. Implemented as a single,
# UNIFORM engine mechanism (see antaranga_prakriya.py `_apply_antadivat`/`_exec`
# and sutra.py `_env`), driven by `purvapara: true` on the ekādeśa rules below.
# Every ekādeśa rule lumps the substitute on the RIGHT (xform `l: null` + an
# `r:` expression placing it on rp[0]), truncating the left to a consonant; then:
#   - The engine sets ?antAdivat on the residue. `_env` synthesises l = the
#     substitute (rp[0]) FOR CONDITION CHECKS ONLY (xform uses the physical
#     strings, so the substitute is never re-appended onto the left) — so
#     phoneme-keyed rules (6.4.8 l:n) see the antavat boundary correctly.
#   - The engine does NO tag stripping. A tag-keyed bha-rule that would mis-read
#     the migrated anta states its own phoneme requirement and the synth blocks
#     it (e.g. 6.4.130 pādaḥ pat carries `l: d`, which fails on a guṇa residue
#     since the synth l = the substitute vowel). All saṁjñās (?aNga/?Ba/?pada)
#     survive (e.g. 6.1.103 reads ?aNga, 6.4.130 reads ?Ba).
#   - The ekādeśa set + every both-l-and-r (vowel-junction) rule is disabled at
#     the resolved junction (the antādivat simultaneity caveat — one phoneme
#     cannot fill both `l` and `r` slots). This subsumes the old 6.1.107→7.3.102
#     override and the 6.1.77/6.1.78 special-casing.
# The same antādivat tagging is replayed inside the `_nitya` priority simulation,
# so sutra-priority sees the same view a real firing would.
# 69: आद् गुणः (6-1-87)
-   sutra: आद्गुणः
