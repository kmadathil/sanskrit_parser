# 379: विश्वस्य वसुराटोः (6.3.128)
# In compound, viśva (pūrva-pada) final a → ā before vasu or rāj+kvip (= rāṭ in nom sg).
# Example: viśva + vasu → viśvāvasu; viśva + rāj_kvip → viśvārāṭ (nom sg via SK294 chain).
# Fires after uttara-pada+sup merge when merged form retains ?vasupada/?rAw+?rAj and ?samAsa tags.
