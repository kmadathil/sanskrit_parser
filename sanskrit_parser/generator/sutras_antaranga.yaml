# 463: प्रत्ययस्थात्कात्पूर्वस्यात इदाप्यसुपः (7-3-44) — idādeśa
# 'a' before 'k' of a pratyaya (?ka_pratyaya) → 'i' when Ap follows.
# Test: sarva + kan + strI_abs → sarvaka + Ap → SK463 → sarvika + Ap → सर्विका.
# asuwapaH (असुपः): no idādeśa when the aka-stem ends a bahuvrīhi (an internal
# sup intervenes), e.g. बहुपरिव्राजका नगरी. Implemented via the ?!bahuvrIhi guard.
# Deferred: the vārttikas (māmaka, naraka, dākṣiṇātya/ihatya, kṣipakādi, tārakā,
# varṇakā, vartakā, aṣṭakā, sūtaka/putrikā/vṛndāraka).
- sutra: प्रत्ययस्थात्कात्पूर्वस्यात इदाप्यसुपः
  id: 7.3.44
  bahiranga: 1   # left-prātipadika substitution; must precede 6.1.101 savarṇa-dīrgha
  condition:
    lp:
      - and
      - ?ka_pratyaya
      - $$aka_anta
      - ?!bahuvrIhi   # asuwapaH: aka-stem at the end of a bahuvrīhi takes no idādeśa
    ll: k
    l: a
    rp: ?Ap
  xform:
    lc: lc[:-2]+str("ik")

