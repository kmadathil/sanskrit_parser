# ════════════════════════════════════════════════════════════════════════════
# समासप्रकरणम् — तत्पुरुषसमासः, Phase T3: नञ्समास (the nañ-tatpuruṣa).
#
# The negative particle नञ् (an avyaya; upadeśa नञ् = "naY", the ञ् an इत्, so its
# real form is न) is the PŪRVA. न + noun → tatpuruṣa: अब्राह्मणः, अनश्वः, अनजः. Reuses
# the T0 spine wholesale — 1.2.43 (upasarjana), 2.4.71 (pūrva sup-luk, though the
# avyaya sup already luks via 2.4.82), 2.4.26 (paravalliṅga) — so the compound
# DECLINES NORMALLY in the uttara's gender (masc a-stem अब्राह्मणः/अनश्वः). The one
# nañ-specific mechanism is the junction mutation of न:
#   6.3.73 नलोपो नञः  — न → अ before a consonant (अब्राह्मणः)
#   6.3.74 तस्मान्नुडचि — न → अन् before a vowel (नुṭ augment: अनश्वः, अनजः)
# both char-window rules on the नञ् samAsaPurva, keyed by ?naY (set by 2.2.6),
# modelled on 6.3.81 (saha→sa). 6.3.75/6.3.77 prakṛtibhāva exceptions deferred.
# ════════════════════════════════════════════════════════════════════════════

# 756/2.2.6: नञ् — the नञ् (न) + a noun forms a tatpuruṣa. Pre-pass saṁjñā
# (bahiranga: -1), same shape as 2.1.24: matches the नञ् pūrva by form (=na), sets
# the pūrva ?samAsaPurva + ?naY (the nañ-membership marker the 6.3.73/74 junction
# rules gate on) and the uttara ?samAsa + ?tatpuruza. Gated on ?samAsa_vivakza
# (only-when-intended). 1.2.43 (upasarjana) and 2.4.26 (paravalliṅga) then fire on
# the resulting ?samAsaPurva / ?tatpuruza. The नञ् has no vigraha vibhakti.
- sutra: नञ्
  id: 2.2.6
  bahiranga: -1
  condition:
    lp:
      - and
      - "=na"
      - "?samAsa_vivakza"
      - "?!samAsaPurva"
    rp:
      - and
      - "?prAtipadika"
      - "?!samAsa"
  update:
    olp: [+samAsaPurva, +naY]
    orp: [+samAsa, +tatpuruza]

# 757/6.3.73: नलोपो नञः — the न of नञ् (its न-कार) is elided before a CONSONANT,
# leaving just अ: न + ब्राह्मण → अ + ब्राह्मण → अब्राह्मणः. Runs in the samāsa pre-pass
# member-window (bahiranga: -1) — the SAME (pūrva | uttara) window 2.2.6 fires in, so
# the uttara stem's first char is `r` (the intervening pūrva-sup, still un-lukked, is
# skipped) and the नञ् tags 2.2.6 just set (?naY / ?samAsaPurva) are on the same lp
# object. The window fixpoint runs 2.2.6 first (which sets those tags) then this rule.
# The pūrva "na" (lc=न्, l=अ): xform lc→"" deletes the न् → pūrva "a". The window
# fixpoint disables the rule after firing (no re-fire). Doing the नलोप here — before
# the main scan — means "a"|ब्राह्मण never meets a vowel-sandhi rule. r:_hal gates the
# consonant-initial uttara (the 6.3.74 अच् case is disjoint).
- sutra: नलोपो नञः
  id: 6.3.73
  bahiranga: -1
  condition:
    lp:
      - and
      - "?naY"
      - "?samAsaPurva"
    l: a
    rp: "?samAsa"
    r: _hal
  xform:
    lc: str("")

# 758/6.3.74: तस्मान्नुडचि — after that [अ of 6.3.73], the नुṭ (न्) augment is added
# before a VOWEL: न + अश्व → अ + नश्व → अनश्वः; न + अज → अनजः. Since 6.3.73 fires only
# before a consonant, this rule does BOTH the न-lopa and the नुṭ in one step, keeping
# them on the CORRECT sides: the pūrva "na" → "a" (नलोप, lc→""), and the नुṭ न् is
# prepended to the UTTARA (अश्व → नश्व, xform r → न+r). नुṭ is a टकित् augment, so by
# 1.1.46 आद्यन्तौ टकितौ it attaches at the front of the अच् (the uttara) — NOT as the
# pūrva's final. Keeping it on the uttara is essential: an "an"-final pūrva would be
# hit by 8.2.7 नलोपः प्रातिपदिकान्तस्य (→ आश्वः). Runs in the same pre-pass member-window
# as 6.3.73 (bahiranga: -1); the नलोप+नुṭ precede the main scan, so "a"|नश्व meets no
# savarṇa-dīrgha. Self-limiting (window fixpoint disables after firing).
- sutra: तस्मान्नुडचि
  id: 6.3.74
  bahiranga: -1
  condition:
    lp:
      - and
      - "?naY"
      - "?samAsaPurva"
    l: a
    rp: "?samAsa"
    r: _ac
  xform:
    lc: str("")
    r: str("n")+r

# ════════════════════════════════════════════════════════════════════════════
# समासप्रकरणम् — तत्पुरुषसमासः, Phase T4: prādi / gati / ku tatpuruṣa (SK761/2.2.18).
#
# SK761/2.2.18 कुगतिप्रादयः — कु, the गति words, and the प्रादि (upasarga) particles
# compound with a subanta → tatpuruṣa: प्र + आचार्य = प्राचार्यः, कु + पुरुष = कुपुरुषः,
# अति + माल = अतिमालः. This is a NITYA-samāsa (aswapada-vigraha: the vigraha uses
# OTHER words — कुपुरुष = कुत्सितः पुरुषः, not *कुना पुरुषः), so it is NOT under विभाषा:
# it does NOT carry the ?samAsa_vivakza "only-when-intended" gate the ≥SK665 vibhāṣā
# rules do. Like the nitya avyayībhāvas (≤SK664, e.g. SK652/2.1.6), it fires whenever
# a प्रादि/गति/कु pūrva is adjacent to a subanta in a flagged member-window (the window
# is entered on any member's semantic sense — `_flagged` in _samasa_prepass_branch).
# Contrast the vibhakti-tatpuruṣas (2.1.24/2.2.8): those ARE aniyata (राजपुरुष has the
# same-word vigraha राज्ञः पुरुषः) → they keep ?samAsa_vivakza.
#
# The prādi/ku/gati particle is the PŪRVA (upasarjana). It is an avyaya (?nipAta →
# 1.1.37 स्वरादिनिपातमव्ययम्), so its sup luks (2.4.71/2.4.82) and it has no vigraha
# vibhakti — like the नञ् pūrva of T3. Reuses the T0 spine — 1.2.43 (upasarjana), 2.4.26
# (paravalliṅga) — so the compound DECLINES NORMALLY in the uttara's gender (masc a-stem
# प्राचार्यः/कुपुरुषः/अतिमालः). Membership tags are intrinsic on the pūrva: ?prAdi (pra/ati…),
# ?ku (ku), ?gati (puras/namas + the ūryādi/astam set — now assigned by the real gati
# saṁjñā SK762/1.4.61, SK768/1.4.67, SK769/1.4.68 below). upapada (SK781/2.2.19 / 3.1.92)
# is DEFERRED — needs the kṛt-pratyaya machinery (कुम्भकारः = कुम्भ + √कृ + अण्).
# ════════════════════════════════════════════════════════════════════════════

# ── gati-saṁjñā (SK762/1.4.61, SK768/1.4.67, SK769/1.4.68) — feeds 2.2.18's gati arm ─
# The gati saṁjñā assigns ?gati to the ūryādi / puras / astam classes; a ?gati word is
# a pūrva of the nitya कुगतिप्रादयः compound (2.2.18). Run in the samāsa pre-pass member
# window (bahiranga: -1) so the ?gati is set BEFORE 2.2.18 (also -1) reads it — the
# window fixpoint runs the saṁjñā first, then 2.2.18. (cvi X→Xī / ḍāc denominal
# derivations of 1.4.61 are DEFERRED — need denominal-affix machinery; Skipped row.)

# SK762/1.4.61: ऊर्यादिच्विडाचश्च — an ūryādi word (ऊरी, उररी… ?UryAdi) + च्वि + डाच् get
# the गति saṁjñā (before कृ/भू/अस्): ऊरी → ?gati → ऊरी + कृत = ऊरीकृतम् (via 2.2.18).
- sutra: ऊर्यादिच्विडाचश्च
  id: 1.4.61
  domain: saMjYA
  bahiranga: -1
  condition:
    lp:
      - and
      - "?UryAdi"
      - "?!gati"
  update:
    olp: [+gati]

# SK768/1.4.67: पुरोऽव्ययम् — the avyaya पुरस् gets the गति saṁjñā → ?gati. A main-scan
# saṁjñā (bahiranga: 0, like 1.1.37) so the ?gati it assigns is present for BOTH the
# samāsa pre-pass window (2.2.18 gati arm) and the main-scan sandhi 8.3.40 नमस्पुरसोर्गत्योः
# (पुरस्कृतम्) on the non-pre-pass derivation path. puras is NO LONGER tagged ?gati
# intrinsically — this rule is now its real source. (namas keeps its own ?gati; its
# source sutra 1.4.74 is out of scope.)
- sutra: पुरोऽव्ययम्
  id: 1.4.67
  domain: saMjYA
  bahiranga: 0
  condition:
    lp:
      - and
      - "=puras"
      - "?!gati"
  update:
    olp: [+gati]

# SK769/1.4.68: अस्तं च — अस्तम् gets the गति saṁjñā → ?gati (अस्तंगत…, via 2.2.18).
