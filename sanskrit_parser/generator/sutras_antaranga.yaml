# internal pañcamī (vigraha case) is then CONSUMED: swap it to prathamā +
# swap_viBakti, so _swap_sups replaces the ṅasi sup with su and the compound
# declines externally as अम् (अपग्रामम्, not the ablative अपग्रामात्).
- sutra: अपपरिबहिरञ्चवः पञ्चम्या
