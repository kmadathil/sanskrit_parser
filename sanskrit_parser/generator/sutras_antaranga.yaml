# 414: पादः पत् (6-4-130)
# When a bha-anga ends in the compound-form of pāda (= pAd, with terminal 'a' already dropped),
# substitute pad for pAd — i.e., shorten ā → a.
# Example: supAd (bha) + inst-ā → supad + ā → supadā; gen sg → supadaḥ.
# Does NOT apply to standalone pAda (compound compounds use pAd, not pAda).
- sutra: पादः पत्
  id: 6.4.130
  condition:
    l: d                  # the aṅga must genuinely end in 'd' (pād). 6.1.85
                          # antādivat: on a guṇa residue (e.g. pāda+ṭā → pAd|ena)
                          # the synth l = the substitute vowel, so this fails and
                          # pādaḥ pat does not mis-fire (→ pādena, not padena).
    lp:
      - and
      - ?Ba
      - $$endsWith_pAd
  xform:
    lc: lc[:-1]+hrasva(lc[-1])

# 415: अनिदितां हल उपधायाः क्ङिति (6-4-24)
# Anidita hal-stem (e.g. √añc, u-it): drop the nasal upadhā (Y=ñ or n) before kit/Ṅit krit suffix.
# Fires at krit-formation window (aYc_u | kvin): aYc → ac. Condition lp: ?DAtu ensures this fires
# only at krit-formation (not later when pratyac is prAtipadika). ll: [Y, n] covers ñ and n.
# anidita check: engine has no +!i syntax; conditions are narrow enough (aYc_u is u-it, not i-it).
- sutra: अनिदितां हल उपधायाः क्ङिति
  id: 6.4.24
  condition:
    lp: ?DAtu
    l: _hal
    ll:
      - Y
      - n
    rp:
      - +k
      - +N
  xform:
    lc: lc[:-1]       # drop upadhā nasal: "aYc" → "ac"

# 416: अचः (6-4-138)
# The 'a' of ac (añcatir after SK415 drops ñ) is elided in bha-anga context.
# ll: a (short) narrows to post-SK415 forms (pratyac) — excludes prAc (ll='A' long).
# ?DAtu: fires only on dynamically-derived ac (inner prakriya result); excludes pre-formed tiryac.
# SK420 (ud ī) is the apavāda for ud-prefix compounds — guarded here by llp: =!ud
# (the left-neighbour pada is not the prefix ud), so no udanc tag is needed.
# Note: 1.4.18 sets ?Ba on the LEFT (aNga), so condition uses lp: ?Ba, not rp: ?Ba.
- sutra: अचः
  id: 6.4.138
  condition:
    lp:
      - and
      - ?aYc
      - ?Ba            # 1.4.18 sets ?Ba on the LEFT element (aNga before bha suffix)
      - ?DAtu          # only dynamically-derived ac from inner prakriya; excludes pre-formed tiryac
    llp: =!ud          # not after the prefix ud — that is SK420's (6.4.139) apavāda
    l: c
    ll: a             # short 'a' upadhā: fires on pratyac, not prAc (long A)
  xform:
    lc: lc[:-1]       # delete 'a': pratyac → pratyc

# 417: चौ (6-3-138)
# Before añc reduced to 'c' (ñ and a both elided), lengthen the preceding member's final vowel.
# Fires at (prefix | c_result) window after SK416; c_result is añcatir with ?aYc, starts with 'c'.
# Note: yaṇ (6.1.77) is blocked here by akṛtavyūhā paribhāṣā — prati+c gives pratīc, not pratyc.
# Examples: prati → pratī (pratīcā), pra → prā (prācā), tiry→tiry (dirgha('y')=no-op → tiryacā).
- sutra: चौ
  id: 6.3.138
  condition:
    rp: ?aYc
    r: c
  xform:
    l: dirgha(l)      # lengthen last char of lp: i→I, a→A, y→y (no-op for consonants)

# 420: उद ईत् (6-4-139)
# Apavāda of SK416: for ud+añc in bha context, substitute ī for the 'a' of ac (not mere deletion).
# The sūtra names the word "ud": the condition reads the left-neighbour pada via
# llp: =ud (no udanc tag). At this window lp is the ac-element and ud sits at ix-1
# (e.g. window (ac | A) with ud as llp → ud+Ic+A → udīcā).
# Note: 1.4.18 sets ?Ba on the LEFT (aNga), so condition uses lp: ?Ba, not rp: ?Ba.
- sutra: उद ईत्
  id: 6.4.139
  overrides: 6.4.138
  condition:
    lp: ?Ba            # 1.4.18 sets ?Ba on LEFT element (aNga before bha suffix)
    llp: =ud           # left-neighbour pada is the prefix ud (उद ईत्)
    l: c
    ll: a
  xform:
    lc: lc[:-1]+str("I")    # a → ī: udac → udIc (= udīc)

# 418: विष्वग्देवयोश्च टेरद्र्यञ्चतावप्रत्यये (6-3-92)
# Before añcatir without suffix: replace ṭi (from last vowel) with adri.
# viṣvag→viṣvadri, deva→devadri, sarvanāma (tad→tadri, yad→yadri, kim→kadri, etc.)
# bahiranga:1 ensures SK418 fires before SK417 (default 99):
# (viṣvag|c) → SK418 → viṣvadri; then SK417 → dirgha(i)=ī → viṣvadrīcā (bha).
# Deferred: etad/idam/adas/sarva — add sarvanAma_pada tag to extend coverage.
- sutra: विष्वग्देवयोश्च टेरद्र्यञ्चतावप्रत्यये
  id: 6.3.92
  bahiranga: 1
  condition:
    - lp: ?vizvag_pada
      rp:
        - and
        - ?aYc
        - ?kvin_pada
      r: [a, c]
    - lp: ?deva_pada
      rp:
        - and
        - ?aYc
        - ?kvin_pada
      r: [a, c]
    - lp: ?sarvanAma_pada
      rp:
        - and
        - ?aYc
        - ?kvin_pada
      r: [a, c]
  xform:
    l: null
    lc: ticAdesha_adri(lc+l)

# 421: समः समि (6-3-93)
# Before añcatir: sam- → sami-. Fires in both bha (r:c) and non-bha (r:a) contexts.
# Non-bha: sami+ac → 6.1.77 yaṇ (i+a→y) → samyac/samyañc.
# Bha: bahiranga:1 ensures SK421 fires before SK417 (default 99): sam→sami, then SK417 dirgha(i)=ī → samīcā.
- sutra: समः समि
  id: 6.3.93
  bahiranga: 1
  condition:
    lp: ?sam_pada
    rp:
      - and
      - ?aYc
      - ?kvin_pada
    r: [a, c]
  xform:
    l: null
    lc: str("sami")

# 422: सहस्य सध्रिः (6-3-95)
# Before añcatir: saha- → sadhrī-. Same two-context pattern as SK421.
# Non-bha: sadhrī+ac → 6.1.77 yaṇ (ī+a→y) → sadhryac/sadhryañc.
# Bha: SK422 (bahiranga:1) fires before SK417: saha→sadhrī, then SK417 dirgha(ī)=ī (no-op) → sadhrīcā.
- sutra: सहस्य सध्रिः
  id: 6.3.95
  bahiranga: 1
  condition:
    lp: ?saha_pada
    rp:
      - and
      - ?aYc
      - ?kvin_pada
    r: [a, c]
  xform:
    l: null
    lc: str("saDrI")

# 423: तिरसस्तिर्यलोपे (6-3-94)
- sutra: तिरसस्तिर्यलोपे
  id: 6.3.94
  condition:
    - lp: ?tiras_pada
      rp:
        - and
        - ?aYc
        - ?kvin_pada
      r: a
    - lp: ?tiras_pada
      rp:
        - and
        - ?aYc
        - ?kvip_pada
      r: a
  xform:
    l: null
    lc: str("tiri")

# 430: आ सर्वनाम्नः (6.3.91) — ā for sarvanāma pūrva-pada before dṛg/dṛś/dṛkṣ/vatup
# tyadAdi (tad/yad/kim) + dfS (dṛś) + kvin/kaY/ksa → tādṛk/tādṛśa/tādṛkṣa forms
# tyadAdi + vatup → tAvat/yAvat/etAvat (measure of volume, 5.2.39)
- sutra: आ सर्वनाम्नः
  id: 6.3.91
  condition:
    - lp: ?sarvanAma_pada
      rp:
        - and
        - ?samAsa
        - ?dfS_pada
        - ?kvin_pada
    - lp: ?sarvanAma_pada
      rp:
        - and
        - ?samAsa
        - ?dfS_pada
        - ?kaY_pada
    - lp: ?sarvanAma_pada           # vārttika: dṛkṣ context (दृक्षे च)
      rp:
        - and
        - ?samAsa
        - ?dfS_pada
        - ?ksa_pada
    - lp: ?sarvanAma              # vatup context (वतुप्, 5.2.39) — direct pronoun, not compound
      rp:
        - and
        - ?vatup
  xform:
    l: null
    lc: lc[:-1] + str("A")  # tad → tA

# 265: त्यदादीनामः (7-2-102)
- sutra:  त्यदादीनामः
  id: 7.2.102
  # FIXME: this needs to happen first, before daSca but unclear how. using this for now
  bahiranga: 1
  # Also fires before strI_abs: SK441 commentary ("त्यदाद्यत्वं टाप्") prescribes
  # tyadAdi-a-substitution before TAp addition for fem of tad/etad/yad/idam/adas.
  # ?!TAp_added blocks re-firing after SK454 has marked the stem as post-TAp
  # (e.g. (etA | am) → 6.1.107 → (et | Am), where l='t' looks raw again).
  condition:
     lp:
       - and
       - ?tyadAdi
       - ?!TAp_added
     rp:
       - ?viBakti
       - ?strI_abs
       - ?ka_pratyaya   # SK463/464: yad+kan/tad+kan → ya/sa + kan → SK464 blocks SK463
  xform:
     l: null
  insert:
     l: str("a")

# 342: किमः कः (7-2-103)
- sutra:  किमः कः
  id: 7.2.103
  # Also fires before strI_abs: SK440 commentary ("किमः कादेशे टाप्") prescribes
  # kim→ka before TAp addition for kim_strI.
  # ?!TAp_added guard same rationale as 7.2.102.
  condition:
     lp:
       - and
       - ?kim
       - ?!TAp_added
     rp:
       - ?viBakti
       - ?strI_abs
  xform:
     lc: str("ka")
     l: null

# 343: इदमो मः (7-2-108) 
