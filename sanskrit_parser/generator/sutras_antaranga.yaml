# ── Avyayībhāva saṁjñās set in the samāsa PRE-PASS (bahiranga -1) so the uttara
#    enters the main scan already carrying ?avyaya / ?napum (no ordering
#    dependency in the window scan). In the pre-pass window the ?avyayIBAva tag
#    is on the uttara = rp, so these condition on rp / update orp (cf. the
#    main-scan versions which were lp/olp). ──────────────────────────────────────

# 451/1.1.41: अव्ययीभावश्च (1.1.41) — the avyayībhāva is an avyaya. Sets ?avyaya
# on the uttara member (the one carrying ?avyayIBAva), so its sup then luks via
# the existing 2.4.82 (अव्ययादाप्सुपः) — e.g. i-stem अधिहरि (hari + su → luk).
- sutra: अव्ययीभावश्च
  id: 1.1.41
  domain: saMjYA
  bahiranga: -1
  condition:
    rp:
      - and
      - "?avyayIBAva"
      - "?!avyaya"
  update:
    orp: +avyaya

# 659/2.4.18: अव्ययीभावश्च (2.4.18) — the avyayībhāva (samāsa) is napuṁsaka.
# Sets a DEFERRED marker ?samasa_napum (NOT ?napum) on the uttara, so the
# samāsānta rules 5.4.108 (?!napum) and 5.4.109 (?napum) can still read the
# uttara's NATIVE gender during the sweep. `_commit_samasa_napum` then turns
# ?samasa_napum → ?napum at end-of-sweep (before the main scan), so 1.2.47 /
# 7.1.24 / the अम् path see the compound as napuṁsaka.
- sutra: अव्ययीभावश्च
  id: 2.4.18
  domain: saMjYA
  bahiranga: -1
  condition:
    rp:
      - and
      - "?avyayIBAva"
      - "?!samasa_napum"
  update:
    orp: [+samasa_napum]

# 657/2.4.83: नाव्ययीभावादतोऽम् (2.4.83, apañcamyāḥ deferred) — after an
# a-ending avyayībhāva, the sup is NOT luk'd (2.4.82) but replaced by अम् (am)
# — EXCEPT in the pañcamī (त्वपञ्चम्याः; see 2.4.83.1 below). Overrides 2.4.82 →
# उपकृष्णम्. i-/other stems fall through to 2.4.82 luk. So the avyayībhāva
# declines invariantly as उपकृष्णम् save the ablative उपकृष्णात् (apañcamyāḥ) and
# the optional tṛtīyā/saptamī forms (2.4.84 bahula).
- sutra: नाव्ययीभावादतोऽम्
  id: 2.4.83
  bahiranga: 2
  overrides: 2.4.82
  condition:
    l: at
    lp:
      - and
      - "?avyayIBAva"
      - "?avyaya"
      - "?!viBakti_5"          # त्वपञ्चम्याः: am does NOT apply in the pañcamī
    rp: "?sup"
  update:
    orp: =am

# 657.1/2.4.83 (त्वपञ्चम्याः sub-rule) — in the pañcamī the अम् of 2.4.83 does
# NOT apply; the real ablative ending surfaces instead (उपकृष्णात्, अपदिशात्).
# Modeled by dropping ?avyaya on the a-ending avyayībhāva uttara when it carries
# viBakti_5, so neither 2.4.83 (am) nor 2.4.82 (luk) fires and the ṅasi → आत्
# a-stem ablative declines normally. Fires before both (bahiranga 1).
- sutra: नाव्ययीभावादतोऽम् त्वपञ्चम्याः
  id: 2.4.83.1
  bahiranga: 1
  condition:
    l: at
    lp:
      - and
      - "?avyayIBAva"
      - "?avyaya"
      - "?viBakti_5"
    rp: "?sup"
  update:
    olp: [-avyaya]

# 658/2.4.84: तृतीयासप्तम्योर्बहुलम् (2.4.84) — for a tṛtīyā/saptamī-sense
# avyayībhāva the अम् (2.4.83) is BAHULA (optional). Modeled as an optional fork
# on the uttara when it carries viBakti_3/7: the fork branch drops ?avyaya
# (overriding 2.4.83), so the real tṛtīyā/saptamī sup surfaces and the compound
# declines (उपकृष्णे); the other branch keeps avyaya → 2.4.83 अम् (उपकृष्णम्).
# (सुमद्रम्/उन्मत्तगङ्गम् nitya-am in saptamī — that exception list is deferred.)
- sutra: तृतीयासप्तम्योर्बहुलम्
  id: 2.4.84
  bahiranga: 1
  optional: true
  condition:
    lp:
      - and
      - "?avyayIBAva"
      - "?avyaya"
      - - or
        - "?viBakti_3"
        - "?viBakti_7"
    rp: "?sup"
  update:
    olp: [-avyaya]

# 660/6.3.81: अव्ययीभावे चाकाले (6.3.81) — सहस्य सः: saha → sa in an avyayībhāva,
# but NOT in the kāla (time) sense. सचक्रम् (saha+cakra, चक्रेण युगपत्). The kāla
# exception (सहपूर्वाह्णम्) is guarded by ?!kAla. Main-scan pūrva-pada
# substitution on the saha samAsaPurva (before its sup luks).
- sutra: अव्ययीभावे चाकाले
  id: 6.3.81
  bahiranga: 1
  condition:
    lp:
      - and
      - "=saha"
      - "?samAsaPurva"
      - "?!kAla"
      - "?!bahuvrIhi_saha"    # the bahuvrīhi saha is handled by 6.3.82 (optional, SK849)
    rp: "?sup"
  xform:
    lc: str("")
    l: str("sa")

# ── S3/S4: samāsānta (SK 676–683) — rule-driven ?samasanta_TaC ───────────────
# 5.4.68 समासान्ताः is the adhikāra; each rule below (pre-pass -1) sets
