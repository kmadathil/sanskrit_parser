# 155: इदुदुपधस्य चाप्रत्ययस्य (8.3.41) — i/u-upadha non-suffix visarjanīya → ṣ before ku/pu
# Applies to stem-H (upasargas, indeclinables); excluded when H is from sup suffix (?viBakti_pada).
# Examples: niH+kftam → nizkftam; duH+kftam → duzkftam; bahiH+kftam → bahizkftam
