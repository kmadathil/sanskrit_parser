# ---- tad-group demonstrative pronoun rules ----
# 381: तदोः सः सावनन्त्ययोः (7.2.106)
# For tyadAdi, the non-final t or d → s before su (nom sg).
# Fires after 7.2.102 has replaced the stem-final consonant with 'a' (l='a').
# Helper tyadAdiHasTorD: confirms a t/d exists in non-final position of lp.
# Helper replaceTorDwithS: replaces the rightmost t/d in lc with 's'.
# Covers: tad→sa→saḥ, etad→eta→esa→eṣaḥ, tyad→tya→sya→syaḥ, adas→ada→asa (→asau via 7.2.107)
- sutra: तदोः सः सावनन्त्ययोः
  id: 7.2.106
  condition:
    lp:
      - and
      - ?tyadAdi
      - $$tyadAdiHasTorD
    l: a
    rp: ?su
  xform:
    lc: replaceTorDwithS(lc)

# 437: अदस औ सुलोपश्च (7.2.107) — out-of-SK-order, added here with SK381
# For adas after SK381 has given "asa": the final 'a' → 'au' (O in SLP1), su is deleted.
# ll: s ensures this fires only AFTER SK381 has converted d→s (i.e. lp = "asa" not "ada").
# Without ll: s, para kāryam would let 7.2.107 fire before 7.2.106, giving wrong "adO".
# Result: asa + su → asO (SLP1) = asau = असौ
- sutra: अदस औ सुलोपश्च
  id: 7.2.107
  condition:
    lp: ?adas
    ll: s
    l: a
    rp: ?su
  xform:
    l: str("O")
    r: null
    rc: null

# 419: अदसोऽसेर्दादु दो मः (8.2.80)
# Fires on the completed pada after aNga+pratyaya sandhi has applied.
# The adas tag is propagated to the pada via join_objects (paninian_object.py).
# $$has_adas_amu guards: only fires when 'ad'+non-e vowel is present in the pada.
# xform: adas_amu_stem returns only 'amu'/'amU' (the stem part).
# insert l: adas_suffix re-exposes the suffix as a separate element so that
# downstream sandhi rules (ṣatva, yaṇ) can fire at the amu|suffix junction.
- sutra: अदसोऽसेर्दादु दो मः
  id: 8.2.80
  condition:
    lp:
      - and
      - ?pada
      - ?adas
      - $$has_adas_amu
  xform:
    l: null
    lc: adas_amu_stem(lc+l)
  insert:
    l: adas_suffix_tagged(lc+l)

# 438: एत ईद्बहुवचने (8.2.81)
# Fires on the completed pada (after aNga+suffix sandhi).
# For adas nom/acc/voc pl: ada + śī(I) → guṇa a+I→e (6.1.87) → pada = 'ade'
# $$has_adas_ami guards: only fires when 'ade' is present in the pada.
# adas_ami() replaces 'ade' → 'amI' (= amī).
- sutra: एत ईद्बहुवचने
  id: 8.2.81
  # Bahuvacana guard: honor the sūtra's restriction. Without it the rule also
  # fires on fem-du adas (adA + O → adA+ī → ad+e via 6.1.87 → 'ade'), producing
  # the wrong amī instead of amū. Two branches because the bahuvacana signal
  # may live on lp (post-merge: ?bahuvacana_pada) or on rp (pre-merge: the
  # sup pratyaya is tagged ?bahuvacana). Without the rp branch, masc-pl with a
  # consonant-initial sup (Bis/Byas/sup-locpl) escapes 8.2.81 at the (ade|Bis)
  # window and 8.2.80 fires first → wrong amU.
  # overrides 8.2.80 because 8.2.80 now also matches 'ade' (so fem-du gets
  # amū); bahuvacana cases must still route through this rule to amī.
  overrides: 8.2.80
  condition:
    - lp:
        - and
        - ?pada
        - ?adas
        - $$has_adas_ami
      rp: ?bahuvacana
    - lp:
        - and
        - ?pada
        - ?adas
        - ?bahuvacana_pada
        - $$has_adas_ami
  xform:
    l: null
    lc: adas_ami(lc+l)

# 439: न मु ने (8.2.3)
# Fires at ada|A (wA = tṛtīyā ek) for the adas pronoun.
# Overrides 7.1.12 (wA→ina for a-final stems) and 6.1.101 (a+A→ā) which would
# obscure the ada|A boundary before SK419 can act.
# Sets pada on olp so SK419 (8.2.80) can fire on the pada-marked ada stem → amu.
# Then 1.4.7 sets Gi on amu; 7.3.120 fires at amu|A → r=nA; samhitā → amunā.
- sutra: न मु ने
  id: 8.2.3
  overrides: [7.1.12, 6.1.101]
  condition:
    lp: ?adas
    l: at
    rp: ?wA
  update:
    olp: +pada

# ---- yuṣmad / asmad (personal pronoun) rules ----

# 382: ङेप्रथमयोरम् (7-1-28)
# am-ādeśa for yuṣmad/asmad: ṅe (dat sg), prathamā (nom sg/du/pl), and dvitīyā (acc
# sg/du/pl) suffixes → "am". SK384/SK388/SK389/SK394 replace the mparyanta stem portion;
# SK391/SK392/SK393 operate on the resulting stem-final char. Marks output suffix +AdeSa
# so SK392/SK393 (which check ?!AdeSa) do not double-fire on the ādeśa suffix.
# bahiranga:2, overrides:7.1.17. Priority (7.1.28, _aps_num=71028): fires after SK384 (72094)
# and SK385 (72090) when competing.
# NOTE: use block-sequence for ?-tag lists (flow-style [?tag] parses as dict in PyYAML).
- sutra: ङेप्रथमयोरम्
  id: 7.1.28
  bahiranga: 2
  overrides: [7.1.17, 7.1.14]
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    rp:
      - ?Ne
      - ?su
      - ?O
      - ?jas
      - ?am
      - ?Ow
      - ?Sas
  xform:
    r: null
    rc: str("am")
  update:
    orp:
      - +AdeSa
      - +am

# SK383: मपर्यन्तस्य (7-2-91) — adhikāra scope indicator ("up to m"); Natural Siddha:
# the "mparyanta" scope is encoded directly in SK384's xform (replacing lc = up to m).

# 384: त्वाहौ सौ (7-2-94)
# For yuṣmad/asmad, the mparyanta (up to-m portion) → tv / ah before su (nom sg).
# Two blocks: one for yuzmad (→ tv), one for asmad (→ ah).
# Priority 72094: fires before SK382 (71028) and SK385 (72090).
- sutra: त्वाहौ सौ
  id: 7.2.94
  overrides: 7.2.97
  condition:
    lp: ?yuzmad
    rp: ?su
  xform:
    lc: str("tv")

- sutra: त्वाहौ सौ
  id: 7.2.94.1
  overrides: 7.2.97
  condition:
    lp: ?asmad
    rp: ?su
  xform:
    lc: str("ah")

# 385: शेषे लोपः (7-2-90)
# d-lopa for yuzmad/asmad. Fires in exactly four positions:
#   - nom sg: after SK384 sets lc→"tv"/"ah", leaving l='d' → SK385 deletes it
#   - nom pl: after SK388 sets lc→"yUya"/"vaya", leaving l='d' → SK385 deletes it
#   - dat sg: after SK394's hier-prakriya gives "tuByad"/"mahyad" → SK385 deletes 'd'
#   - abl/dat pl (Byas): fires directly; SK393/SK392 are blocked by rp conditions
# For all other positions, SK387/SK390/SK392/SK393 override 7.2.90 and handle 'd' directly.
- sutra: शेषे लोपः
  id: 7.2.90
  overrides: [7.3.102, 7.3.103]
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    l: d
  xform:
    l: null

# 386: युवावौ द्विवचने (7-2-92)
# Dual mparyanta: yuzmad → yuv, asmad → āv, for ALL dual vibhakti.
# Preserves trailing 'a' (lc[-1]): result is "yuvad"/"Avad". SK387 then handles nom/acc
# du (deletes 'd' via insert→'A'). For other dual forms (gen/loc du), SK392/SK393 fire
# on 'd' directly (deferred). Priority 72092: fires before SK385 (72090) and SK382 (71028).
- sutra: युवावौ द्विवचने
  id: 7.2.92
  condition:
    lp: ?yuzmad
    rp: ?dvivacana
  xform:
    lc: str("yuv")+lc[-1]

- sutra: युवावौ द्विवचने
  id: 7.2.92.1
  condition:
    lp: ?asmad
    rp: ?dvivacana
  xform:
    lc: str("Av")+lc[-1]

# 387: प्रथमायाश्च द्विवचने भाषायाम् (7-2-88)
# Nom du ā-ādeśa: deletes the final stem char and inserts 'A'. Fires after SK386 changes stem
# to yuva/Āva (stem-final 'a' preserved by SK386). "yuv"+"A" + suffix "am" (from SK382)
# → sandhi a+A=A → yuvām ✓.
# overrides [7.2.89, 7.2.86] to block y-ādeśa (SK392) and ā-lengthening (SK393) from also
# firing for nom du (O is vowel-initial but this rule takes precedence).
- sutra: प्रथमायाश्च द्विवचने भाषायाम्
  id: 7.2.88
  overrides: [7.2.89, 7.2.86]
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    rp:
      - and
      - ?praTamA
      - ?dvivacana
  xform:
      l: null
  insert:
      l: str("A")
  
    
# 388: यूयवयौ जसि (7-2-93)
# Nom pl mparyanta: yuzmad → yūya, asmad → vaya, before jas. Sets lc and leaves l='d';
# SK385 then deletes 'd' → "yUya". SK382 (covering ?jas) supplies suffix "am".
# 6.1.107 (amipūrvaḥ) fires: "yUya"+"am" → "yUy"+"am" → yūyam ✓.
# Priority 72093 > SK382 (71028), so SK388 fires first.
- sutra: यूयवयौ जसि
  id: 7.2.93
  condition:
    lp: ?yuzmad
    rp: ?jas
  xform:
    lc: str("yUya")

- sutra: यूयवयौ जसि
  id: 7.2.93.1
  condition:
    lp: ?asmad
    rp: ?jas
  xform:
    lc: str("vaya")

# 389: त्वमावेकवचने (7-2-97)
# All singular mparyanta: yuzmad → tv, asmad → m, for remaining singular vibhakti.
# Mechanism: xform sets lc="tva"/"ma" and nulls l (the 'd'); insert: l: lc[-1]+l re-appends
# original "ad" (lc[-1]='a', l='d') as a hier-prakriya. The hier-prakriya applies ato guṇe
# (6.1.97): prior 'a' of "tva" is dropped before 'a' of "ad" → "tvad". In the outer loop,
# SK390/SK392/SK393 then fire on 'd' directly (they override SK385); SK385 does not fire.
# Apavādas that override SK389 for specific cases:
#   - SK384 (7.2.94): overrides for nom sg → tvam/aham
#   - SK394 (7.2.95): overrides for dat sg → tubhyam/mahyam
#   - SK392 (7.2.89): overrides for vowel-initial suffixes → tvayā/mayā etc.
- sutra: त्वमावेकवचने
  id: 7.2.97
  condition:
    lp: ?yuzmad
    rp: ?ekavacana
  xform:
    lc: str("tva")
    l: null
  insert:
    l: lc[-1]+l

- sutra: त्वमावेकवचने
  id: 7.2.97.1
  condition:
    lp: ?asmad
    rp: ?ekavacana
  xform:
    lc: str("ma")
    l: null
  insert:
    l: lc[-1]+l

# 390: द्वितीयायां च (7-2-87)
# Acc ā-ādeśa. Fires on whatever 'd'-final stem is current (after SK389 for sg, after SK391
# for acc pl, after SK386 for du). xform: l='d'→null; insert: l: str("A") forces a
# hier-prakriya at the resulting a+A junction → 6.1.101 (akaḥ savarṇe dīrghaḥ) → "yuzmA".
# For acc sg: SK389 fires first (yuzmad→tvad via ato guṇe), then SK390 fires on tvad.
# For acc pl: SK391 fires first (suffix→"ns"), then SK390 fires on yuzmad directly.
# SK382 supplies suffix "am"; "tvA"+"am" → sandhi → tvām ✓. Gives tvām, mām, yuvām, āvām.
# overrides 7.2.89 (SK392) to block y-ādeśa for acc forms.
- sutra: द्वितीयायां च
  id: 7.2.87
  overrides: 7.2.89
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    rp:
      - and
      - ?dvitIyA
  xform:
    l: null
  insert:
    l: str("A")


# 391: शसो न (7-1-29)
# Acc pl: śas content is "as" (S is it-letter). xform r='a'→'n', rc='s' unchanged →
# suffix becomes "ns". After other pair rules quiesce, (stem, "ns") merges to merged_pada
# (?pada). 8.2.23 (saMyogāntasya lopaḥ) then fires on (merged_pada, avasāna): the
# pada ends in two consonants (ns) → deletes final 's' → stem+n.
# bahiranga:2, overrides:7.1.28 (SK391 beats SK382 for ?Sas so it gets "ns" not "am").
- sutra: शसो न
  id: 7.1.29
  bahiranga: 2
  overrides: 7.1.28
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    rp: ?Sas
  xform:
    r: str("n")

# 392: योऽचि (7-2-89)
# y-ādeśa: fires on the 'd'-final stem before vowel-initial non-ādeśa suffixes.
# overrides 7.2.90 (SK385); SK389 fires first (giving "tvad"), then SK392 fires on 'd'.
# l: str("y") replaces 'd' → "tvad" → lc="tva", l="y" → "tvay"+vowel suffix ✓.
# Guard rp: [and, ?viBakti, ?!AdeSa] skips am-ādeśa suffixes already handled by SK382.
# Produces: tvayā/mayā (inst sg), tvayi/mayi (loc sg), yuvayoḥ/āvayoḥ (gen/loc du).
# SK390 (7.2.87, overrides 7.2.89) blocks SK392 for acc sg/du. ✓
# NOTE: gen sg (tava/mama) needs additional rules; those forms are deferred.
- sutra: योऽचि
  id: 7.2.89
  overrides: 7.2.90
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    r: _ac
    rp:
      - and
      - ?viBakti
      - ?!AdeSa
  xform:
    l: str("y")

# 393: युष्मदस्मदोरनादेशे (7-2-86)
# ā-ādeśa: fires directly on the 'd'-final stem before non-ādeśa hal-initial suffixes.
# overrides 7.2.90 (SK385); does not need SK385 to precede it.
# xform: l='d'→null → stem "yuzma"; insert: l: str("A") forces a hier-prakriya at the
# resulting a+A junction ("yuzma"+"A") → internal sandhi gives "yuzmA".
# "yuzmA"+"Bis"=yuzmābhiḥ ✓; "yuvA"+"ByAm"=yuvābhyām ✓.
# rp condition lists all suffixes that are ādeśa (SK382 targets) and excludes them,
# so SK393 only fires on truly non-ādeśa hal suffixes.
# rp: ?!Byas also excludes Byas (abl/dat pl) so SK395 can give short-a yuzmaBhyam.
# Without ?!Byas: SK393 (72086) fires before SK395 (71030) → wrongly gives yuzmāBhyam.
- sutra: युष्मदस्मदोरनादेशे
  id: 7.2.86
  overrides: 7.2.90
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    r: _hal
    rp:              # anAdeSe
      - and
      - ?!Byas
      - ?!Ne
      - ?!su
      - ?!O
      - ?!jas
      - ?!am
      - ?!Ow
      - ?!Sas
  xform:
    l: null
  insert:
    l: str("A")

# 394: तुभ्यमह्यौ ङयि (7-2-95)
# Dat sg: mparyanta → tuBhya (yuzmad) / mahya (asmad).
# SK389 (72097) fires first (lc→"tva"), then SK394 (72095) overwrites lc.
# Mechanism: lc: str("tuBya"), l: null, insert: l: lc[-1]+l — re-appends original "ad"
# via hier-prakriya. ato guṇe (6.1.97) fires: prior 'a' of "tuBya" dropped before 'a' of
# "ad" → "tuByad". SK385 then fires in the outer loop to delete 'd' → "tuBya"/"mahya".
# SK382 supplies suffix "am"; "tuBya"+"am" → 6.1.107 → tuByam ✓; mahyam ✓.
