# 472: हलस्तद्धितस्य (6-4-150) — a taddhita ya-kāra after hal is elided before ṅīp ī.
# General over the taddhita ya-affixes (yat/ṣyañ/yañ), guarded by ?tadDita_ya so a
# base-internal 'y' is NOT elided (विद्या+अण् → वैद्य → वैद्यी, not वैदी — SC Vasu).
# Self-sufficient condition: detect 'y' at upadhā position (lp ends hal+y+a)
# directly on the snapshot (e.g. gārgya). 6.4.150 does NOT wait for 6.4.148 to
# drop the final 'a' — under the 6.4.22 ābhīya asiddhavat (view + diff
# composition in antaranga_prakriya.py), both rules fire against the same
# gārgya snapshot: 6.4.148 drops the final 'a' (l→null) and 6.4.150 drops the
# upadhā 'y' (lc:lc[:-1]); their snapshot-relative diffs compose into 'gArg',
# then merge with ī → गार्गी.
- sutra: हलस्तद्धितस्य
  id: 6.4.150
  condition:
     lp:
       - and
       - ?aNga
       - ?tadDita_ya              # the 'y' must be a taddhita ya-affix, not a base 'y'
       - $$hal_taddhita_ya_upaDa  # lp ends in (hal + 'y' + 'a') — y in upadhā after hal
     l: a
     rp: ?NI
  xform:
     lc: lc[:-1]   # drop the upadhā 'y' (the last char of lc); 'a' (=l) stays for 6.4.148

# 499: सूर्यतिष्यागस्त्यमत्स्यानां य उपधायाः (6.4.149) — for the bha-aṅgas sūrya/
# tiṣya/agastya/matsya (tagged ?sUryAdi), the upadhā 'y' is elided before a
# taddhita (and, per the vārttika मत्स्यस्य ङ्याम्, before ṅī). matsya + ṅīṣ:
# 6.4.149 drops the upadhā 'y' (matsya → matsa) while 6.4.148 drops the final
# 'a'; both fire on the same pre-yasyeti matsya snapshot under 6.4.22 ābhīya
# asiddhavat (the 6.4.148↔6.4.149 pair in _ASIDDHA_PEERS) and compose → मत्सी.
# The sūrya/tiṣya/agastya taddhita derivatives (सौरी/तैषी/आगस्ती) are deferred
# (they need the 4.3.x taddhita machinery).
- sutra: सूर्यतिष्यागस्त्यमत्स्यानां य उपधायाः
  id: 6.4.149
  condition:
     lp:
       - and
       - ?aNga
       - ?Ba
       - ?sUryAdi
     ll: y          # the upadhā char is 'y'
     l: a
     rp: ?NI
  xform:
     lc: lc[:-1]    # drop the upadhā 'y'; 'a' (=l) stays for 6.4.148

