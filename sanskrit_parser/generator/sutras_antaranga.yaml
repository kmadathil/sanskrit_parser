# 360: मघवा बहुलम् (6-4-128)
# Optional tṛ-anta substitute for maGavan before any pratyaya (bahulam = variously).
# n → t (creates maghavat-type stem); ++f adds ṛ as it-marker (like śatṛ's u-it),
# enabling SK361 (7.1.70) to insert nUM before sarvanamasthana suffixes.
# Distinct from kroṣṭu's tfc tag (where ṛ is the stem-final, not an it): here ṛ IS an it.
- sutra: मघवा बहुलम्
  id: 6.4.128
  domain: prakfti
  bahiranga: 1
  optional: true
  condition:
     lp:
      - and
      - ?aNga
      - ?maGavan
     l: n
     ll: a
  xform:
     l: str("t")
  update:
     olp:
      - ++f          # ṛ added as it-marker (like śatṛ u-it); enables SK361 (7.1.70) via +f condition

