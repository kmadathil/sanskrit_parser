      - ?Satf
    rp: ?sarvanAmasTAna
  xform: null

# 444: वा नपुंसकस्य (7.1.79) — optional nUM for neuter abhyasta śatṛ stems before sarvnāmasthāna
# Apavāda of SK427: inserts nUM itself (same as SK372) when optional fires.
# overrides: [7.1.70, 7.1.72] → SK361/SK372 disabled on BOTH fires and skip paths (engine behavior).
# - Fires path: SK444 inserts nUM → dadant; SK427 fires null (no change) → dadanti ✓
# - Skip path:  dadat unchanged; SK427 fires null (no change) → dadati ✓
# SK427 is NOT in overrides, so it fires on both paths (null, harmless).
- sutra: वा नपुंसकस्य
  id: 7.1.79
  overrides: [7.1.70, 7.1.72]
  optional: true
  condition:
    lp:
      - and
      - ?abhyasta
      - ?Satf
      - ?napum
    rp: ?sarvanAmasTAna
  xform:
    lc: numAgama(lc+l)
    l: null

# 445: आच्छीनद्योर्नुम् (7.1.80) — optional nUM for śatṛ stems before SI (neuter dual via 7.1.19) or NI (nadī feminine)
# Fires for: (a) neuter dual: rp ?SI (from 7.1.19 O→SI substitution), lp ?Satf + ?!abhyasta
#            (b) feminine nadī: rp ?NI (NIp suffix), lp ?Satf + ?!abhyasta
# abhyasta (class 3 reduplicated) stems are excluded — they use SK444 before sarvanāmasthāna only.
# SK446 overrides for ?Sap (class 1 śap) and ?Syan (class 4 śyan), making nUM mandatory.
# xform: lp = "pacat" → numAgama("pacat") = "pacant"; l=null. Joined with rp (NI/SI) → "pacantI"/"pacantI".
- sutra: आच्छीनद्योर्नुम्
  id: 7.1.80
  optional: true
  condition:
    - lp:
        - and
        - ?Satf
        - ?!abhyasta
      rp: ?SI
    - lp:
        - and
        - ?Satf
        - ?!abhyasta
      rp: ?NI
  xform:
    lc: numAgama(lc+l)
    l: null

