# 504: पुंयोगादाख्यायाम् (4.1.48) — a male designation used of his wife → NIz.
# puṃyoga semantics not modelled; fires on ?puMyoga → गोपी. The vārttikas
# (पालकान्त गोपालिका; सूर्या devatā-cāp) are deferred.
- sutra: पुंयोगादाख्यायाम्
  domain: prakfti
  bahiranga: 2
  id: 4.1.48
  overrides: 4.1.4
  condition:
     lp: ?puMyoga
     rp: ?strI_abs
  update:
     orp: =NIz

# 505: इन्द्रवरुणभवशर्वरुद्रमृडहिमारण्ययवयवनमातुलाचार्याणामानुक् (4.1.49) — ānuk
# augment (आन्) at the end of the aṅga + NIz. आन् is a kit augment (added at end,
# 1.1.46); its ā coalesces with the stem-final 'a' by savarṇa-dīrgha → the net
# effect on the stem string is: final 'a' → 'ā', then append 'n'. Implemented as
# `lc: lc+dirgha(l)+str("n"), l: null`. ṇatva (8.4.1/8.4.2) then gives इन्द्राणी,
# रुद्राणी (r-stems) but leaves वरुणानी, हिमानी, अरण्यानी (no r/ṣ, or ṇ/y blocks
# the aṭ-vyavāya). overrides 4.1.4 (ṭāp) and 4.1.5 (which would add NIp to the
# now n-final stem). Senses & the मातुली optional-ānuk vārttika deferred.
- sutra: इन्द्रवरुणभवशर्वरुद्रमृडहिमारण्ययवयवनमातुलाचार्याणामानुक्
  domain: prakfti
  bahiranga: 2
  id: 4.1.49
  overrides: [4.1.4, 4.1.5]
  condition:
     lp: ?indrAnuk
     l: a
     rp: ?strI_abs
  xform:
     lc: lc+dirgha(l)+str("n")
     l: null
  update:
     orp: =NIz

# 506: क्रीतात्करणपूर्वात् (4.1.50) — a-final compound ending in krīta (√krī+kta)
# whose pūrva-pada names the means (?karaNa) → ṅīṣ. llp peeks the karaNa pūrva.
# → वस्त्रक्रीती. (धनक्रीता "kvacin na" deferred: dhana not tagged ?karaNa.)
- sutra: क्रीतात्करणपूर्वात्
  domain: prakfti
