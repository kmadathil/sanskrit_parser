  id: 2.3.4
  bahiranga: -2
  overrides: ["2.3.46"]
  condition:
    # yoga_para: particle precedes the noun (noun's llp); yoga_pUrva: particle
    # follows it (noun's rrp). The user's direction choice fires exactly one arm.
    - lp:
        - and
        - "?prAtipadika"
        - "?!has_viBakti"
      llp: [and, [or, =antarA, =antareRa], "?yoga_para"]
    - lp:
        - and
        - "?prAtipadika"
        - "?!has_viBakti"
      rrp: [and, [or, =antarA, =antareRa], "?yoga_pUrva"]
  update:
    olp: [+viBakti_2, +has_viBakti]

# ════════════════════════════════════════════════════════════════════════════
# Phase K2 — karmapravacanīya + dvitīyā (SK 546–558; karaka_plan.md §K2)
#
# Pre-pass Pass A (antaranga_prakriya.py) runs these saṁjñā rules on the avyaya
# *particle* element (?nipAta + a semantic_* sense tag) BEFORE the noun pass, so
# 2.3.8 can read the particle's karmapravacanIya via llp/rrp. Each saṁjñā rule
# matches the particle by literal (=anu …) + its sense primitive, guards
# "?!karmapravacanIya" (ekā-saṁjñā), and writes +karmapravacanIya plus the
# case-governance marker +kp_dvitIyA (this particle governs dvitīyā; read by
# 2.3.8). The governance DIRECTION — kp_pUrva (governs the noun to its LEFT —
# japam anu) vs kp_para (governs the noun to its RIGHT — anu harim) — is NOT
# sense-derived: it is a separate user input on the particle (defaulting to
# kp_pUrva in cmd_line/UI), and 2.3.8 is keyed on kp_dvitIyA + that direction.
# The particle still takes its own su via 2.3.46 (avyaya → 2.4.82 luk in the
# main scan), so no guard is added there.
#
# Sense long-tail deferred (Skipped, generator_status.md): bhāga/vīpsā (1.4.90),
# vīpsā (1.4.91), padArTa/anvavasarga/garhA/samuccaya (1.4.96), and anu's
# re-inclusion in 1.4.90 (its lakṣaṇa/tṛtīyārtha/hīna senses are 1.4.84/85/86;
# 1.4.90 here covers prati/pari, sidestepping the 1.4.84-vs-1.4.90 overlap).
# SK554 (1.4.93 adhi/pari anarthaka) deferred — needs the gati-saṁjñā/nighāta layer.
# ════════════════════════════════════════════════════════════════════════════

