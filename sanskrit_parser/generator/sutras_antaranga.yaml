# 243: शेषो घ्यसखि (1-4-7)
# sezaH - either
#  a) not strI
#  b) stri & it & ut but not Niti
#  c) stri & it & ut & Niti and the not nadI arm.
# rp: ?!strI guards the feminine-pratyaya path: at the (lp | strI_abs/NIp/NIz)
# window, lp's ?strI tag isn't set yet (it lands on (patn|NIp) join), but the
# rp's ?strI marks an upcoming feminine derivation. Without this, 1.4.7 arm 1
# fires on a bare i-stem like pati and Ghi-saṃjña survives to the vibhakti
# window where 7.3.111 (घेर्ङिति) mis-substitutes the nadī ī → e. (Pair with
# the same guard on 1.4.8 for the compound pati case — SK491 गृहपत्नी.)
- sutra: शेषो घ्यसखि
  domain: saMjYA
  bahiranga: 0
  id: 1.4.7
  condition:
   -  l: [it, ut]
      lp:
        - "and"
        - ?!strI
        - ?!saKi
      rp: ?!strI
   -  l: [it, ut]
      lp:
        - "and"
        - ?!saKi
        - -N
      rp: ?!strI
   -  l: [it, ut]
      lp:
        - "and"
        - ?!saKi
        - ?Niti_hrasva_seza
      rp: ?!strI
  update:
     olp: +Gi

