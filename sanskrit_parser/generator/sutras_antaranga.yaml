# ════════════════════════════════════════════════════════════════════════════

# SK831/6.3.34: स्त्रियाः पुंवद्भाषितपुंस्कादनूङ्समानाधिकरणे स्त्रियामपूरणीप्रियादिषु — a
# bhāṣitapuṁska (has a masc counterpart), non-ūṅ FEMININE pūrva (?puMvat), in
# apposition (samānādhikaraṇa) with a feminine uttara (?uttara_strI) of a bahuvrīhi,
# takes its MASCULINE form — EXCEPT before an ordinal (pūraṇī) or a priyādi word. दीर्घे
# जङ्घे यस्याः → दीर्घजङ्घा (दीर्घा → दीर्घ). Pre-pass pūrva-substitution saṁjñā (like
# 6.3.42). The पूरणी/प्रियादि carve-outs are the apavādas below (6.3.38) + the ?!priyAdi
# guard; the other prohibitions (6.3.37/40/41) override this rule.
- sutra: स्त्रियाः पुंवद्भाषितपुंस्कादनूङ् समानाधिकरणे स्त्रियामपूरणीप्रियादिषु
  id: 6.3.34
  domain: saMjYA
  bahiranga: -1
  condition:
    lp:
      - and
      - "?samAsaPurva"
      - "?puMvat"
      - "?!priyAdi"
      - "?!puMvadBAva"
    rp:
      - and
      - "?bahuvrIhi"
      - "?uttara_strI"
  update:
    olp: [+puMvadBAva]

