      - and
      - ?pada
      - =tvAm
  xform:
    lc: str("tv")
    l: str("A")
# 407.1: asmad acc sg (mAm → mA)
- sutra: त्वामौ द्वितीयायाः
  id: 8.1.23.1
  optional: true
  condition:
    lp:
      - and
      - ?pada
      - =mAm
  xform:
    lc: str("m")
    l: str("A")

# 406: तेमयावेकवचनस्य (8-1-22)
