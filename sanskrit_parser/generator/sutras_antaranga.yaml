# 356: इन्हन्पूषार्यम्णां शौ (6-4-12)
# Block 6.4.8 for in/han/pUzan/aryaman stems before all sarvānāmasthāna EXCEPT Si.
# "शौ" = loc. of suffix name "śi" (Si); rule says upadhā dīrgha ONLY before Si,
# not before O/jas/am/Ow/su. Together with 6.4.13 (su re-enabled), forms like
# hastin nom sg → hastī (6.4.13), nom du → hastinau (6.4.12 blocks 6.4.8).
- sutra: इन्हन्पूषार्यम्णां शौ
  id: 6.4.12
  overrides: 6.4.8
  condition:
    - l: n
      ll: i                   # in-stems: penultimate vowel is 'i' (hastin, yogin…)
      rp:
        - and
        - ?sarvanAmasTAna
        - ?!sambudDi
        - ?!Si                # do NOT block when Si follows — 6.4.8 handles Si
    - lp: =pUzan              # pūṣan — specific proper noun (an-stem, exceptional)
      l: n
      rp:
        - and
        - ?sarvanAmasTAna
        - ?!sambudDi
        - ?!Si
    - lp: =aryaman            # aryaman — specific proper noun (an-stem, exceptional)
      l: n
      rp:
        - and
        - ?sarvanAmasTAna
        - ?!sambudDi
        - ?!Si
    - lp: ?han            # han dhatu tag
      l: n
      rp:
        - and
        - ?sarvanAmasTAna
        - ?!sambudDi
        - ?!Si
  # No xform: blocking rule. When this fires, 6.4.8 is suppressed.

# 357: सौ च (6-4-13)
# Re-enable upadhā dīrgha for in/pUzan/aryaman stems before su (nom sg), except voc.
# 6.4.12 blocks 6.4.8 for su (su has no Si tag); 6.4.13 independently applies the
# same lengthening xform as 6.4.8 for the specific case of su + non-vocative.
- sutra: सौ च
  id: 6.4.13
  condition:
    - l: n
      ll: i                   # in-stems
      rp:
        - and
        - ?su                 # specifically su (nom sg marker); ?suw would be too broad
        - ?!sambudDi          # not vocative (su2 carries sambudDi)
    - lp: =pUzan
      l: n
      rp:
        - and
        - ?su
        - ?!sambudDi
    - lp: =aryaman
      l: n
      rp:
        - and
        - ?su
        - ?!sambudDi
    - lp: ?han
      l: n
      rp:
        - and
        - ?su
        - ?!sambudDi
  xform:
    lc: lc[:-1]+dirgha(lc[-1])

# 425: अत्वसन्तस्य चाऽधातोः (6.4.14)
# Lengthen upadhā (penultimate vowel) of a non-dhātu anga before su (nom sg), NOT in sambuddhi,
# when anga ends in ugit -at (matup/ktavatu) or ugit -as (Iyasun).
# bahiranga:3 fires this BEFORE numAgama (SK361/7.1.70): dhīmat→dhīmāt, then nUM→dhīmānt, t-drop→dhīmān.
# The ?!sambudDi guard keeps voc sg as dhīman (no lengthening; nUM fires but SK317/SK425 skip sambuddhi).
- sutra: अत्वसन्तस्य चाऽधातोः
  id: 6.4.14
  bahiranga: 3
  condition:
    - lp:                     # -at (u-it): matup, ktavatu — masculine only
        - and
        - ?!DAtu
        - +u
        - ?pum
      l: t
      ll: a
      rp:
        - and
        - ?su
        - ?!sambudDi
    - lp:                     # -as non-dhātu: ANY as-final stem (not just the u-it Iyasun)
        - and                 # — सुमनाः, वेधाः, बहुयशाः as well as श्रेयान्/विद्वान्.
        - ?!DAtu              # The `+u` restriction was too narrow: the sūtra is
        - ?pum                # अत्वसन्तस्य (any अस्-ending non-dhātu), so an underived
        - ?!avyaya            # अस्-noun must lengthen too. Guards exclude the as-final
        - ?!nipAta            # NON-declining/pronominal stems that must NOT lengthen:
        - ?!sarvanAma         # tiras/adhas (avyaya, nipāta) and adas (असौ, own rules).
      l: s
      ll: a
      rp:
        - and
        - ?su
        - ?!sambudDi
  xform:
    lc: lc[:-1]+dirgha(lc[-1])

