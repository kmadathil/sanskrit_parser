# winner forks the sentence — one branch applies it, one falls through to the
# general rule — and each fork derives as a separate output (the tests assert
# both branches). The fixed tṛtīyā rules (2.3.6/19/20/21/23) are apavādas to
# the 2.3.46 prathamā default; 2.3.6 additionally beats 2.3.5 dvitīyā by para.
