# समासप्रकरणम् — तत्पुरुषसमासः, Phase T2: karmadhāraya + dvigu.
#
# KARMADHĀRAYA (समानाधिकरणस्तत्पुरुषः): both members stand in the SAME case
# (samānādhikaraṇa — one referent, both prathamā in the vigraha: नीलम् उत्पलम्),
# so the pūrva carries ?viBakti_1 (not a 2–7 case as in the vibhakti-tatpuruṣas).
# A karmadhāraya IS a tatpuruṣa (declines paravalliṅga via 2.4.26); 1.2.42 just
# names the samānādhikaraṇa sub-class. The vidhi rules (2.1.57 viśeṣaṇa, 2.1.49
# pūrvakāla) set +samAnADikaraRa so 1.2.42 can name only the genuinely
# same-case compounds (NOT e.g. the ekadeśī पूर्वकायः, whose pūrva is viBakti_1
# but is a ṣaṣṭhī/ekadeśī tatpuruṣa, not a karmadhāraya).
#
# DVIGU (द्विगुः): a saṅkhyā-pūrva tatpuruṣa (पञ्च गावः, त्रीणि भुवनानि). 2.1.52
# forms it AND names it dvigu; 2.4.1 makes a समाहार (aggregate) dvigu napuṁsaka
# singular; 5.4.92 gives a go-final dvigu the ṬaC samāsānta (पञ्च + गो → पञ्चगव).
# The ?dvigu tag reaches the merged stem (join_objects Tier-3) so the existing
# 4.1.21 (SK479) ṅīp fires on a REAL dvigu (त्रिलोकी), not the in_compound shim.
# ════════════════════════════════════════════════════════════════════════════

