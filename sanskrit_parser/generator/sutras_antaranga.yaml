# 377: क्विन्प्रत्ययस्य कुः (8-2-62) — ku-substitution for kvin-derived stems at pada-end.
# Covers cu-final kvin stems (j→g, same as 8.2.30) and ś-final path.
# For j-final stems (ṛtvij, sraj, yuj-after-8.2.23): kvinKutva(j)=g, then 8.4.56→k.
# For ñ-final (Y, after 8.2.23 deletes j from yuñj): kvinKutva(Y=ñ)=N(ṅ) → gives nom sg yuṅ.
# For ś-final (S): natural order — 8.2.36 fires S→ṣ(z), 8.2.39 fires ṣ→ḍ(q), then here q→g.
#   Before voiceless (loc pl su): 8.4.55 g→k, then 8.3.59 s→ṣ → dikṣu.
# Overrides 8.2.30 for kvin stems (same result for cu; adds ñ-final and ḍ-final coverage).
#
# PARTIAL IMPLEMENTATION: SK (8-2-62 vṛtti) states: kvinpratyayo yasmāt tasya kavargo
# 'ntādeśaḥ syāt padānte — the ka-varga replaces the final of ANY kvin-derived stem at
# pada-end. The condition l:[cu,S,q,n] covers currently implemented stems:
#   - cu (j,J,Y): j-finals ṛtvij, sraj, yuj; ñ-final (Y) from yuñj after 8.2.23
#   - S (ś): diś via 8.2.36 S→ṣ(z) and 8.2.39 ṣ→ḍ(q)
#   - q (ḍ): the ḍ that results from the ś path above
#   - n (dental): dental n at pada-end after 8.2.23 deletes c from añc-stems (numAgama path);
#     8.2.23 (82023) fires before 8.3.24 (83024) so n+c → n (c deleted) before n→M→Y chain runs
# SK also notes coḥ kuḥ (8.2.30) does NOT apply subsequently (asiddhatva).
# See SK373 entry in generator_status.md for full unimplemented stem list.
- sutra: क्विन्प्रत्ययस्य कुः
  id: 8.2.62
  overrides: 8.2.30
  condition:
     lp:
       - and
       - ?pada
       - ?kvin
     l: [cu, S, q, n]
  xform:
     l: kvinKutva(l)

