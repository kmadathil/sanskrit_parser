# ════════════════════════════════════════════════════════════════════════════
# समासप्रकरणम् — तत्पुरुषसमासः, Phase T5: tatpuruṣa samāsānta (टच्/ṬaC).
#
# Rule-driven via the proven ?samasanta_TaC + _insert_samasanta path (identical to
# the avyayībhāva 5.4.107–112): each rule below sets ?samasanta_TaC on the
# qualifying tatpuruṣa uttara, and the pre-pass step _insert_samasanta inserts the
# टच् (wac, form अ) after it; the main scan merges stem + wac → an a-stem, so the
# compound declines as a masc a-stem (परमराजः, महाराजः). The rājan-final case reuses
# the exact rājan+wac → rāja path already proven by the avyayībhāva 5.4.108 (उपराजम्,
# न-lopa via 6.4.144 नस्तद्धिते). 6.3.46 आन्महतः is a PŪRVA-substitution (महत् → महा),
# modelled like 6.3.81 (saha→sa). Deferred (Skipped rows): the ahar/sakhi arms of
# 5.4.91 (द्व्यहः — the ahar टच् collides with the existing dvyahna न्-retention, which
# keeps the samāsānta wac deliberately non-ट-marked → द्व्यह्न, SK238), and 5.4.86
# अङ्गुलि / 5.4.94 an-final / 5.4.101 khārī (stems not worth adding now).
# ════════════════════════════════════════════════════════════════════════════

# 788/5.4.91: राजाहःसखिभ्यष्टच् — a rājan/ahar/sakhi-final tatpuruṣa takes the टच्
# (ṬaC) samāsānta. Here the rājan arm (?rAjan uttara): परम + राजन् → परमराज + अ(टच्)
# → परमराज (न-lopa 6.4.144, as उपराजम्) → declines masc a-stem परमराजः. Sets the
# marker; _insert_samasanta inserts the wac. Disjoint from the avyayībhāva 5.4.108
# (?avyayIBAva); this is gated on ?tatpuruza. (ahar/sakhi arms deferred — status.)
- sutra: राजाहःसखिभ्यष्टच्
  id: 5.4.91
  bahiranga: -1
  condition:
    rp:
      - and
      - "?tatpuruza"
      - "?rAjan"
      - "?!samasanta_TaC"
  update:
    orp: [+samasanta_TaC]

# 807/6.3.46: आन्महतः समानाधिकरणजातीययोः — a महत् pūrva becomes महा (आत्, i.e. →ā)
# before a samānādhikaraṇa (karmadhāraya) / jātīya uttara: महत् + राजन् → महा + राजन्
# → (5.4.91 टच्) → महाराजः. A PŪRVA-substitution in the samāsa pre-pass member-window
# (bahiranga: -1, the same (pūrva | uttara) window the nañ junction rules 6.3.73/74
# use): lp = महत् pūrva (?samAsaPurva), rp = the uttara carrying ?samAnADikaraRa
# (set by 2.1.57 on the uttara — so gating rp, not lp, pins the genuine karmadhāraya,
# not a ṣaṣṭhī महत्-pūrva). xform wipes the pūrva to महा (lc→"", l→"mahA"), as 6.3.81
# does saha→sa. The window fixpoint runs 2.1.57 (sets the tags) first, then this.
- sutra: आन्महतः समानाधिकरणजातीययोः
  id: 6.3.46
  bahiranga: -1
  condition:
    lp:
      - and
      - "=mahat"
      - "?samAsaPurva"
    rp:
      - and
      - "?samAsa"
      - "?samAnADikaraRa"
  xform:
    lc: str("")
    l: str("mahA")

# SK787/5.4.87: अहस्सर्वैकदेशसंख्यातपुण्याच्च रात्रेः — a रात्रि-final tatpuruṣa after
# अहन् / सर्व / एकदेश / संख्यात / पुण्य takes the समासान्त → रात्र (an a-stem): पुण्य + रात्रि =
# पुण्यरात्रः, पूर्व + रात्रि = पूर्वरात्रः. Rule-driven via the proven ?samasanta_TaC +
# _insert_samasanta path — रात्रि is i-final, so रात्रि + wac → रात्र (इ-lopa by 6.4.148
# यस्येति च, exactly like giri → उपगिरम्); the अच्/टच् distinction is accent-only, not
# modelled. The wac's ?pum + SK814/2.4.29 रात्राह्नाहाः पुंसि make the compound masc →
# पुण्यरात्रः declines as the राम a-stem. Pūrva gated to the {puṇya/sarva/saṅkhyā/ahan}
# set. (द्विरात्रः — a संख्या pūrva → समाहार dvigu — is DEFERRED: 2.4.1 napuṁsaka vs 2.4.29
# masc priority is a separate carve-out; पुण्य avoids the dvigu.)
- sutra: अहस्सर्वैकदेशसंख्यातपुण्याच्च रात्रेः
  id: 5.4.87
  bahiranga: -1
  condition:
    lp:
      - and
      - "?samAsaPurva"
      - - or
        - "?puRya"
        - "?sarva"
        - "?ekadeSa"
        - "?ahan"
    rp:
      - and
      - "?tatpuruza"
      - "?rAtri"
      - "?!samasanta_TaC"
  update:
    orp: [+samasanta_TaC]

# ════════════════════════════════════════════════════════════════════════════
# समासप्रकरणम् — तत्पुरुषसमासः, Phase T-liṅga: gender EXCEPTIONS to 2.4.26.
#
# 2.4.26 परवल्लिङ्गम् (T0) makes a tatpuruṣa take the uttara's gender. The rules
# below OVERRIDE that for specific uttara stem-classes, keyed on the uttara. They
# reuse the ?samasa_liNga_locked flag join_objects already honours (set by
# _commit_samasa_napum for the napuṁsaka overrides): a rule sets the target gender
# on the uttara + the lock, so the (uttara | sup/wac) merge cannot revert it.
# Implemented: 2.4.29 (rātra/ahan/aha-final → masculine). Deferred (Skipped rows):
# 2.4.19 तत्पुरुषोऽनञ्कर्मधारयः (napuṁsaka only in the 2.4.17 saṃjñā-doubtful domain —
# inert without saṃjñā tagging, and would wrongly napuṁsaka-ise ordinary masc
# tatpuruṣas like राजपुरुषः), 2.4.30 अपथं नपुंसकम् (needs the pathin अच् samāsānta
# 5.4.74, deferred), 2.4.31 अर्धर्चाः पुंसि च (needs the अर्धर्चादि stem set).
# ════════════════════════════════════════════════════════════════════════════

# SK814/2.4.29: रात्राह्नाहाः पुंसि — a tatpuruṣa ending in रात्र / अह्न / अह is MASCULINE,
# overriding the uttara's native gender (रात्रि f., अहन् n. → the compound is masc).
# Pre-pass gender override (bahiranga: -1, domain saṁjñā), keyed on the uttara
# (?tatpuruza + the ?rAtri/?ahan family + native ?napum/?strI): set +pum, drop the
# native gender, and lock (?samasa_liNga_locked) so the uttara-sup merge keeps masc.
# The रात्रि arm has a full surface — पुण्यरात्रः: SK787/5.4.87 gives रात्रि → रात्र (a-stem),
# then this rule makes it masc. Gated ?!samAhAra + ?!samasa_napum so it does NOT clobber
# a समाहार dvigu (napuṁsaka by 2.4.1, द्व्यहम्/द्विरात्रम्). NOTE: the ahan-arm full a-stem
# surface (द्व्यहः) still needs the ahar टच् (5.4.91 ahar-arm), deferred — T5 Skipped row.
- sutra: रात्राह्नाहाः पुंसि
  id: 2.4.29
  domain: saMjYA
  bahiranga: -1
  condition:
    rp:
      - and
      - "?tatpuruza"
      - - or
        - "?rAtri"
        - "?ahan"
      - - or
        - "?napum"
        - "?strI"
      - "?!samAhAra"
      - "?!samasa_napum"
      - "?!samasa_liNga_locked"
  update:
    orp: [-napum, -strI, +pum, +samasa_liNga_locked]

# ════════════════════════════════════════════════════════════════════════════
# समासप्रकरणम् — बहुव्रीहिसमासः, Phase B0 (bahuvrihi_plan.md): spine + saṁjñā +
# anyapadārtha (referent) gender + core samānādhikaraṇa formation.
#
# A bahuvrīhi is EXOCENTRIC: it denotes ANOTHER thing (anyapadārtha) not connoted by
# its members, so it declines in that EXTERNAL referent's gender — NOT the uttara's
# (contrast tatpuruṣa SK812/2.4.26 परवल्लिङ्गम्, which takes the uttara gender). Both
# members are prathamānta in the vigraha and both are upasarjana. The composer signals
# bahuvrīhi intent with ?bahuvrIhi_vivakza (parallel to ?samAsa_vivakza; the CLI -B /
# B-UI sets it), supplies the referent case/vacana on the uttara, and the referent
# liṅga as ?referent_pum / ?referent_strI / ?referent_napum on the uttara.
# ════════════════════════════════════════════════════════════════════════════

# SK829/2.2.23 + SK830/2.2.24: शेषो बहुव्रीहिः (adhikāra) + अनेकमन्यपदार्थे (vidhi) —
# two+ prathamānta words denoting ANOTHER thing (anyapadārtha) form a bahuvrīhi. In the
# vigraha both members are prathamā (the pūrva carries ?viBakti_1 here); the UTTARA is
# not viBakti-constrained because the composer sets its sup to the referent's EXTERNAL
# case (like the tatpuruṣa uttara). The pūrva → ?samAsaPurva (upasarjana via SK-shared
# 1.2.43), the uttara → ?samAsa + ?bahuvrIhi. Gated on ?bahuvrIhi_vivakza
# ("only-when-intended"; bahuvrīhi has no lexical/uttara-class discriminator — any two
# words — so an explicit intent is required). The pūrva's prathamā sup luks via 2.4.71;
# the uttara's sup (the referent case) is RETAINED and inflects → पीताम्बरः / पीताम्बरम् / … .
#
# ANYAPADĀRTHA GENDER (fused here): the compound is EXOCENTRIC — it declines in the
# EXTERNAL referent's gender, NOT the uttara's (contrast tatpuruṣa SK812/2.4.26). The
# composer sets the referent liṅga on the uttara (?referent_pum/strI/napum, overriding
# the native gender); this rule pins it with ?samasa_liNga_locked (the flag join_objects
# honours, paninian_object.py:159–164) so the referent gender survives the (uttara | sup)
# and any (uttara | samāsānta) merge — a later wac cannot revert it. Do NOT use 2.4.26.
- sutra: अनेकमन्यपदार्थे
  id: 2.2.24
  bahiranga: -1
  condition:
    lp:
      - and
      - "?viBakti_1"
      - "?bahuvrIhi_vivakza"
      - "?!samAsaPurva"
    rp:
      - and
      - "?prAtipadika"
      - "?bahuvrIhi_vivakza"
      - "?!samAsa"
  update:
    olp: [+samAsaPurva]
    orp: [+samAsa, +bahuvrIhi, +samasa_liNga_locked]

# ════════════════════════════════════════════════════════════════════════════
# समासप्रकरणम् — बहुव्रीहिसमासः, Phase B1 (bahuvrihi_plan.md): puṁvadbhāva
# (feminine pūrvapada → its masculine bhāṣitapuṁska form) in a samānādhikaraṇa
# bahuvrīhi, + the prohibitions. Modelled on the tatpuruṣa karmadhāraya puṁvadbhāva
# SK746/6.3.42: the composer supplies the masculine form (दीर्घ) + ?puMvat directly,
# and the rule fires as a saṁjñā (?puMvadBAva) documenting the puṁvadbhāva — the full
# ṅīp/ṭāp-stripping derivation (दीर्घा→दीर्घ) is deferred (see generator_status.md).
# The "before a FEMININE uttara" (समानाधिकरणे स्त्रियाम्) condition is checked via a
# stable ?uttara_strI tag the composer sets on the fem uttara — its native ?strI is
