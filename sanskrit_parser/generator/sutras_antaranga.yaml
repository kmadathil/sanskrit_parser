# 380: स्कोः संयोगाद्योरन्ते च (8-2-29) — s or k, when first member of a conjunct, is deleted at pada-end.
# Vasu examples: √lasj+kvip → लक् (s deleted from sj→j→k via 8.2.30);
#                √masj+kvip → मक् (same); √takṣ+kvip → तट्/तड् (k deleted from kṣ→ṣ→ḍ→ṭ).
# Condition: lp=?pada (word boundary), ll=[s,k] (penultimate = first of conjunct), l=_hal (final = second of conjunct).
# Xform: delete the penultimate s or k (ll: null).
# Derivation for √takṣ+kvip nom sg: takz → 8.2.29 k del → taz → 8.2.39 ṣ→ḍ(q) → 8.4.56 opt ḍ→ṭ = taṭ/taḍ.
# Loc pl: taz→8.2.39 ṣ→ḍ(q)→8.4.55 ḍ→ṭ(w)+su = taṭsu (8.4.42 blocks ṣṭutva after pada-ṭ, so s stays).
- sutra: स्कोः संयोगाद्योरन्ते च
  id: 8.2.29
  overrides: 8.2.23
  condition:
     lp: ?pada
     ll: [s, k]
     l: _hal
  xform:
     lc: lc[:-1]    # delete the penultimate s/k (first of conjunct); lc="tak" → lc[:-1]="ta" for takz

