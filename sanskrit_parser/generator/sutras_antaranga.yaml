# ════════════════════════════════════════════════════════════════════════════
# Phase K5 — apādāna + pañcamī (SK 586–605; karaka_plan.md §K5)
#
# Apādāna saṁjñā cluster (1.4.24–31) writes kAraka_apAdAna; the verb-conditioned
# members read the sentence dhātu via rp (BItrA, parAji, vAraRArTa, antarDi,
# upayoga, jani, praBava). 2.3.28 maps apAdAna → pañcamī (viBakti_5). Reuses the
# K2 karmapravacanīya particle machinery (apa/āṅ/pari/prati kp → 2.3.10/2.3.11
# pañcamī) and the K3/K4 pre-pass optional-fork for the vibhāṣā rules.
#
# Three 2.3.x cluster rules read an adjacent yoga-word via llp/rrp (saha-yoga
# style): 2.3.29 (anya/ārāt/itara/ṛte/dik), 2.3.32 (pṛthak/vinā/nānā).
#
# Two THREE-WAY vibhāṣā rules (2.3.32 pṛthak/vinā/nānā → tṛtīyā/pañcamī/dvitīyā;
# 2.3.35 dūra/antika → dvitīyā/pañcamī/tṛtīyā) are modelled as three rules with
# distinct sub-sutra aps ordered HIGH→LOW: the two optional arms (highest aps)
# win first and fork, the non-optional arm (lowest aps) is the final fall-through
# — yielding exactly three branches via the ?!has_viBakti guard.
#
# Deferred (generator_status.md Skipped): the SK587 जुगुप्साविरामप्रमादार्थानाम् and
# SK594 ल्यब्लोपे … vārttikas (verb long-tail); the SK595 ñc-uttarapada / āc /
# āhi-yukta yoga-words and the SK602 yoga-vibhāga अगुणे/स्त्रियाम् branch.
# ════════════════════════════════════════════════════════════════════════════

