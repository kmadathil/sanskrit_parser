# "ataddhite" is naturally satisfied: SvanType tag does not propagate through taddhita
# derivation (paninian_object.py join_objects allowlist), so śauvana- etc. won't have it.
# Overrides 6.4.134 (general al-lopa of -a- before n) and 6.4.136 (optional al-lopa for Ni/SI).
- sutra: श्वयुवमघोनामतद्धिते
