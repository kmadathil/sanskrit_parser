# 482: पुरुषात्प्रमाणेऽन्यतरस्याम् (4-1-24)
# Vibhāṣā: for puruṣa-final Dvigu in the pramāṇa sense, ṅīp is optionally
# re-enabled. Listed as `overrides: 4.1.21` (NOT 4.1.22): if SK482 overrode
# 4.1.22, the optional-fired branch would also disable SK480 on v0 (engine's
# optional-overrides disabling, antaranga_prakriya.py:712-715), so the
# "SK482-skips" branch would have no rule to fall back on. By overriding 4.1.21
# instead, the skip branch leaves SK480 (4.1.22) free to fire → ṭāp →
# द्विपुरुषा; the fire branch wins over SK480 via higher _aps_num (para
# kāryam) → ṅīp → द्विपुरुषी. Both Vasu alternants produced.
# Non-pramāṇa puruṣa-Dvigu never satisfies ?pramARe, so SK482 cannot fire —
# SK480 alone applies → only द्विपुरुषा (Vasu: "No option is allowed here").
- sutra: पुरुषात्प्रमाणेऽन्यतरस्याम्
