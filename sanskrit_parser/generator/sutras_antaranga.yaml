# 453: स्त्रियाम् (4-1-3) — adhikāra only; no YAML rule needed.
# Commentary: अधिकारोऽयम् — "in the feminine"; scope for SK454+.
# The domain: prakfti mechanism covers this.

# 469: अनुपसर्जनात् (4-1-14) — adhikāra only; no YAML rule needed.
# Governs that the strī affixes apply to an anupasarjana (non-subordinate)
# prātipadika, and (per the commentary's jñāpana) by तदन्तविधि to a stem *ending
# in* the affixes named by SK470 (4.1.15) — which is what lets aindra/gārgya etc.
# take ṅīp. The anupasarjana restriction is naturally honoured: strī affixes
# attach to the head stem, not to a compound-internal upasarjana member.

# 473: प्राचां ष्फ तद्धितः (4-1-17) — no YAML rule needed.
# Per the Eastern Grammarians, ष्फ (sPa) optionally attaches after a yañ-final
# stem. Modelled directly: tests compose [..., yaY_t, sPa, strI_abs] when the
# ष्फ form is wanted; without sPa the bare गार्गी form derives. The optionality
# is the test's choice. sPa is defined in pratyaya.py; its ष is the it (SK474),
# its फ → आयन् (SK475 / 7.1.2).

# 474: षः प्रत्ययस्य (1-3-6) — saṁjñā only; no YAML rule needed.
# Affix-initial ष is an it. Encoded directly in each pratyaya's `its` list
# (e.g. sPa = Pratyaya("Pa", its=["z"], ...)). No separate engine rule.

# 476: सर्वत्र लोहितादिकतन्तेभ्यः (4-1-18) — no YAML rule needed.
# In all schools (sarvatra) — not just per the Eastern Grammarians — ष्फ
# obligatorily attaches after stems of the lohitādi gaṇa and after stems
# ending in 'kan' (the kaN affix). Like SK473, modelled by the test composer
# including sPa explicitly: [lohita, yaY_t, sPa, strI_abs] → लौहित्यायनी
# (parallel to गार्ग्यायणी; no ṇatva-trigger so the न stays न).

# 477: कौरव्यमाण्डूकाभ्यां च (4-1-19) — no YAML rule needed.
# ष्फ obligatorily attaches after कौरव्य (kuru+yaY) and माण्डूक.
# Test: [kuru, yaY_t, sPa, strI_abs] → कौरव्यायणी (the र of kuru triggers
# ṇatva on the आयन् न).

