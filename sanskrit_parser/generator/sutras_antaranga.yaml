      - "?samAsa_vivakza"
      - "?!samAsaPurva"
    rp:
      - and
      - "?prAtipadika"
      - "?srita_gaRa"
      - "?!samAsa"
  update:
    olp: [+samAsaPurva]
    orp: [+samAsa, +tatpuruza]

# 812/2.4.26: परवल्लिङ्गं द्वन्द्वतत्पुरुषयोः — a tatpuruṣa (and dvandva) takes the
# gender of its LAST member. For generation this is already realized by
# join_objects (the compound merge prefers the uttara's liṅga; paninian_object.py
# ~line 154), so the uttara declines in its own gender with no change here. This
# pre-pass saṁjñā records that paravalliṅga licenses the compound gender (?paravalliNga
# marker) — it documents the rule firing and gives the T-liṅga exceptions
# (2.4.19/29/30/31 napuṁsaka/puṁvad overrides) a clean saṁjñā to override.
- sutra: परवल्लिङ्गं द्वन्द्वतत्पुरुषयोः
