# 427: नाभ्यस्ताच्छतुः (7.1.78) — abhyasta (reduplicated) śatṛ stems do not take nUM.
# Blocks both SK361 (7.1.70, ugit nUM) and SK372 (7.1.72, napum Jhal nUM) for abhyasta Satf.
# ?Satf distinguishes śatṛ-derived stems from other ṛ-it forms (e.g. maghavan ++f via SK360).
# jakshi-class (SK428/6.1.6): jakshat, jAgrat, etc. → no nUM in strong forms.
# SK372 added to overrides so napum abhyasta stems (dadat_napum) also get no nUM by default,
# leaving room for SK444 (7.1.79) optional exception.
- sutra: नाभ्यस्ताच्छतुः
  id: 7.1.78
  overrides: [7.1.70, 7.1.72]
  condition:
