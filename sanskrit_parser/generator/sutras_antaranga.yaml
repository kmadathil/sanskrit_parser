# 503: बह्वादिभ्यश्च (4.1.45) — bahvādi gaṇa → optional NIz.
# बह्वी (fire) / बहुः (skip → plain u-stem).
- sutra: बह्वादिभ्यश्च
  domain: prakfti
  bahiranga: 2
  id: 4.1.45
  optional: true
  condition:
     lp: ?bahvAdi
     rp: ?strI_abs
  update:
