# 430: आ सर्वनाम्नः (6.3.91) — ā for sarvanāma pūrva-pada before dṛg/dṛś/dṛkṣ/vatup
# tyadAdi (tad/yad/kim) + dfS (dṛś) + kvin/kaY/ksa → tādṛk/tādṛśa/tādṛkṣa forms
# tyadAdi + vatup → tAvat/yAvat/etAvat (measure of volume, 5.2.39)
