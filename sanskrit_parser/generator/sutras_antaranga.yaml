# 392: योऽचि (7-2-89)
# y-ādeśa: final 'a' of stem → 'ay' before vowel-initial (non-ādeśa) suffix.
# Fires after SK389 (72097 > 72089) + SK385: stem ends in 'a', so l: _ac matches.
# l: str("ay") gives e.g. "tva" → lc="tv", l="ay" → "tvay"+"A" = tvayā ✓.
# Produces: tvayā/mayā (inst sg), tvayi/mayi (loc sg), yuvayoḥ/āvayoḥ (gen/loc du).
# NOTE: overrides SK389 (7.2.97) — blocks SK389 for vowel-initial sg forms.
#       SK390 (7.2.87, overrides 7.2.89) blocks SK392 for acc sg/du. ✓
# NOTE: gen sg (tava/mama) needs additional rules; SK392 will fire there too but
#       those forms are deferred from test tables.
- sutra: योऽचि
  id: 7.2.89
  overrides: 7.2.90
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    r: _ac
    rp:
      - and
      - ?viBakti
      - ?!AdeSa
  xform:
    l: str("y")

# 393: युष्मदस्मदोरनादेशे (7-2-86)
# ā-ādeśa: lengthen final vowel of stem before non-ādeśa hal-initial suffix.
# Fires after SK385 (d-lopa): stem ends in 'a', so l: _ac matches.
# xform l: dirgha(l): 'a'→'A'. "yuzmA"+"Bis"=yuzmābhiḥ ✓; "yuvA"+"ByAm"=yuvābhyām ✓.
# rp: ?!Byas excludes Byas/Byas2 (abl/dat pl) so SK395 can give short-a yuzmaBhyam.
# Without ?!Byas: SK393 (72086) fires before SK395 (71030) → wrongly gives yuzmāBhyam.
- sutra: युष्मदस्मदोरनादेशे
  id: 7.2.86
  overrides: 7.2.90
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    r: _hal
    rp:              # anAdeSe
      - and
      - ?!Byas
      - ?!Ne
      - ?!su
      - ?!O
      - ?!jas
      - ?!am
      - ?!Ow
      - ?!Sas
  xform:
    l: null
  insert:
    l: str("A")

# 394: तुभ्यमह्यौ ङयि (7-2-95)
# Dat sg: mparyanta → tuBhy (yuzmad) / mahy (asmad); ṅi → am (am-ādeśa).
# SK389 (72097) fires first (lc→"tva"), then SK394 (72095) fires and overwrites lc.
# xform: lc + suffix r/rc both changed in one rule (includes the am-ādeśa of ṅi).
# After SK385: "tuBy"+"am" = tuByam = tubhyam ✓; "mahy"+"am" = mahyam ✓.
# SK382 also fires for ?Ne (idempotent: r already "a", rc already "m").
- sutra: तुभ्यमह्यौ ङयि
  id: 7.2.95
  overrides: 7.2.97
  condition:
    lp: ?yuzmad
    rp: ?Ne
  xform:
    lc: str("tuBya")
    l: null
  insert:
    l: lc[-1]+l


