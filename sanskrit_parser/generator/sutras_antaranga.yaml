# ════════════════════════════════════════════════════════════════════════════
# Phase K7 — adhikaraṇa + saptamī (SK 632–646; karaka_plan.md §K7) — FINAL phase
#
# 1.4.45 ādhāra → kAraka_aDikaraRa; 2.3.36 maps it (and dūra/antika) → saptamī.
# The saptamī chapter has several SET-valued (vibhāṣā) results, all riding the
# K3 pre-pass optional-fork (antaranga_prakriya._run_fixpoint): the apply-branch
# writes the marked vibhakti, the skip-branch falls through to the general rule,
# and each fork derives as a separate output sentence (tests assert the set).
#
# Two fork families:
#  (a) ṣaṣṭhī/saptamī (SK635/636/637/638): the noun carries semantic_Seza + the
#      specific primitive, so 2.3.50 (K0) gives ṣaṣṭhī by DEFAULT; the marked
#      rule is optional + overrides 2.3.50 → apply ⇒ saptamī, skip ⇒ ṣaṣṭhī.
#  (b) adhikaraṇa-default (SK641/642/643): the noun is kAraka_aDikaraRa so 2.3.36
#      gives saptamī by DEFAULT; the marked rule is optional + overrides 2.3.36
#      → apply ⇒ its vibhakti (tṛtīyā / pañcamī), skip ⇒ saptamī.
# This matches the SK gloss ("ṣaṣṭhī/saptamī already obtained; the rule is for
# the optional other vibhakti").
#
# sati-saptamī (2.3.37) / anādara absolute construction: the paired words are
# adjacent elements both tagged semantic_BAvalakzaRa; _neighbours skips the
# avasāna separators, so each partner sees the other via llp/rrp.
#
# KP tail (SK644–646): adhi/upa in the īśvara/adhika sense → karmapravacanīya
# carrying both a direction tag (kp_para — these particles precede their noun)
# and the kp_saptamI marker; 2.3.9 reads kp_saptamI (like K2's 2.3.8 reads the
# bare kp) and gives saptamī, overriding the 2.3.8 dvitīyā.
#
# Deferred (generator_status.md Skipped): the SK642 taddhita-lup machinery
# itself (nakṣatra → plain stems per §6); the śeṣa-pratiṣedha vārttikas under
# SK633 (kta+in, sādhvasādhu, nimitta-yoga); 2.3.9's aiśvarya pakṣa beyond the
# adhi/upa examples; SK646 surface (no tiṅanta for adhi-√kṛ — saṁjñā fork only).
# ════════════════════════════════════════════════════════════════════════════

