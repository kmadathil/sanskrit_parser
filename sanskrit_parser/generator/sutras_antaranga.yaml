        - ?pada
        - =mama
    - lp:
        - and
        - ?pada
        - =mahyam
  xform:
    lc: str("m")
    l: str("e")

# 405: बहुवचनस्य वस्नसौ (8-1-21)
# Optional vaH/naH enclitic for yuzmad/asmad gen/dat/acc pl.
# No case-syncretism: abl pl = yuzmAt (SK397), dat pl = yuzmaByam (unique).
