# 194: अमिपूर्वः (6-1-107)
-   sutra:  अमिपूर्वः
    id: 6.1.107
    # pūrvarūpa ekādeśa: ak + am → the pūrva vowel. Uniform substitute-on-right
    # (l: null drops the pūrva vowel; r: l puts the pūrva-form substitute on
    # rp[0]). The engine sets ?antAdivat so 6.4.8 (l: n) sees l = substitute on
    # e.g. गार्ग्यायन|अम्, and disables the both-l-and-r set — incl. 7.3.102 supi
    # ca — at the resolved junction (the simultaneity caveat: the pūrvarūpa 'a'
    # cannot be both the aṅga-final and a yañ-suffix initial), so no 7.3.102
    # override is needed. overrides 6.1.101/6.1.102 for same-window selection.
    overrides: [6.1.101, 6.1.102]
    purvapara: true   # 6.1.85 antādivat
    condition:
       l: _ak
       rp: ?am
    xform:
       l: null
       r: l

