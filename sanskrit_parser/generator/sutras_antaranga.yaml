# kṛdanta carries ?kft (read via llp/rrp). Prohibited governors (2.3.69/70) carry
# ?kft_aSazWI — the ?!kft_aSazWI guard then keeps this off, so the karman falls to
# 2.3.2 dvitīyā (no finite verb → rp ?!karmaRi true). Apavāda to 2.3.2 / 2.3.18.
