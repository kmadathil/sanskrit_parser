# 176: एतत्तदोः सुलोपोऽकोरनञ्समासे हलि (6.1.132)
# For tad and etad, delete su (= r with ?ru after 8.2.66) before consonant.
# Fires at (r | hal) junction after 8.2.66 converts su's s→r(?ru), before 6.1.114 or 8.3.15 act.
# Priority: SPSP 61132 > 61114 (6.1.114) by para kāryam; 61132 < 83015 (8.3.15) by tripādi rule.
# akoH (अकोः) exception is handled by the exact lc match (=sa / =eza): a ka-pratyaya
# stem (saka/eṣaka via kan, SK463/464) has lc "saka"/"eṣaka" ≠ "sa"/"eṣa", so su-r is
# preserved (sako viṣṇuḥ) — see manual_list.py SK176 akoḥ tests. nañsamāsa still deferred.
- sutra: एतत्तदोः सुलोपोऽकोरनञ्समासे हलि
  id: 6.1.132
  condition:
    - lp:
        - and
        - ?tad_pada
      l: s
      lc: =sa
      r: _hal
    - lp:
        - and
        - ?etad_pada
      l: s
      lc: =eza
      r: _hal
  xform:
    l: null
  update:
    olp: -ru

