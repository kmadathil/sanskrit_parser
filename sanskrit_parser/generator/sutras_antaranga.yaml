# saṁjñā 2.1.5 and vidhi 2.1.6 are fused into one pre-pass rule for S1A.)
- sutra: अव्ययं विभक्तिसमीपसमृद्ध्यर्थाभावात्ययासंप्रतिशब्दप्रादुर्भावपश्चाद्यथानुपूर्व्ययौगपद्यसादृश्यसंपत्तिसाकल्यान्तवचनेषु
