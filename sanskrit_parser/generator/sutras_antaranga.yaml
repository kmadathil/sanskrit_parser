# 257: पतिः समास एव (1-4-8)
# Two guards block Ghi-saṃjña on the feminine path of compound pati:
#   lp: ?!strI — blocks at the vibhakti window after (patn|NIp) merge has
#                tagged the merged stem as ?strI (gRhapatnī | Ne).
#   rp: ?!strI — blocks at the pratyaya window (pati | strI_abs/NIp/NIz),
#                where lp is bare pati (no ?strI yet) but the rp pratyaya
#                carries ?strI signalling a feminine derivation.
# Without these, ?Gi rides through (patn|NIp) and the gRha+patnI samāsa merge,
# then 7.3.111 (घेर्ङिति) fires on ?Gi+?Ni at the vibhakti window substituting
# the nadī ī → e and mis-routing the oblique-sg cells (cat/paY/zaz/sap-ek).
- sutra: पतिः समास एव
  domain: saMjYA
  bahiranga: 0
  id: 1.4.8
  condition:
     lp:
       - "and"
       - ?pati
       - ?samAsa
       - ?!strI
     rp: ?!strI
  update:
     olp: +Gi
     
# 257: पतिः समास एव (1-4-8-1)
