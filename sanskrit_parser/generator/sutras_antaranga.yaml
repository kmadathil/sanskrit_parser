        - "=pari"
        - "=bahis"
      - "?samAsa_vivakza"
      - "?!samAsaPurva"
    rp:
      - and
      - "?prAtipadika"
      - "?viBakti_5"
      - "?!samAsa"
  update:
    olp: [+samAsaPurva]
    orp: [+samAsa, +avyayIBAva, -viBakti_5, +viBakti_1, +swap_viBakti]

