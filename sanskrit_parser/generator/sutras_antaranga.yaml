# 164: प्रथमयोः पूर्वसवर्णः (6-1-102)
-   sutra:  प्रथमयोः पूर्वसवर्णः 
    id: 6.1.102
    overrides: [6.1.97, 6.1.77, 6.1.101]
    # 6.1.85 antādivat: uniform substitute-on-right — pūrva-savarṇa dīrgha is
    # placed on rp[0]; 6.1.103 (तस्माच्छसो नः) then rewrites the surviving Sas
