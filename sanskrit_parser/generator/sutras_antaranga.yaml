# Phase K6 — Ṣaṣṭhī (SK 607–631; karaka_plan.md §K6). The ṣaṣṭhī chapter.
# 2.3.50 (śeṣe) was pulled forward into K0 as the non-kāraka fallback. The
# members here are all viBakti_6 ([+viBakti_6, +has_viBakti], guard
# "?!has_viBakti") except the optional forks that pair it with another vibhakti.
# Three rule families:
#   (a) yoga-word peeks: a fixed-surface particle (hetoH, dakziRatas, …) sits
#       adjacent to the governed noun; read via llp/rrp literal match, exactly
#       like K2/K3/K4 (saha, namas, antarā).
#   (b) verb-conditioned śeṣa-ṣaṣṭhī (2.3.51–58/61): the karaṇa/karman is named
#       (not abhihita) so it relates as śeṣa; the noun carries semantic_Seza and
#       the rule reads the meaning-class tag on the sentence dhātu via rp. Each
#       is an apavāda to 2.3.50 (overrides: ["2.3.50"]) pinning the same ṣaṣṭhī
#       with the sutra-specific scope, so the fired trace names the right sutra.
#   (c) kṛd-yoga (2.3.65–71): the governing word is a pre-formed kṛdanta noun
#       carrying a kṛt-TYPE tag (kft / kta_vartamAna / kta_aDikaraRa / kftya /
#       kft_aSazWI), read off the physical neighbour via llp/rrp. The kāraka noun
#       carries its semantic primitive (svatantra/Ipsitatama). Real kṛt
#       derivation is deferred (karaka_plan.md §6).
#
# Deferred (generator_status.md Skipped):
#   - SK624 (2.3.66 ubhaya-prāpti): needs a genuine dual-kāraka kṛt-frame
#     analysis (which of two simultaneously-prāpta kārakas is *the* karman) — no
#     kṛt-derivation support yet.
#   - SK627/628 (2.3.69/70 prohibitions) are realized as the negative guard
#     "?!kft_aSazWI" on 2.3.65 (the prohibited governors — laT-ādeśa/avyaya/
#     niṣṭhā/khalartha/tṛn, future-aka, ādhamarṇya-in — carry kft_aSazWI); they
#     have no positive YAML rule. Asserted via the negative case
#     (दैत्यान् घातुको हरिः → 2.3.65 must NOT fire → karman → dvitīyā).
# ════════════════════════════════════════════════════════════════════════════

