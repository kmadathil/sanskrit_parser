# 454: अजाद्यतष्टाप् (4-1-4)
# olp: +TAp_added marks the stem so 7.2.102/103 can avoid re-firing on the post-TAp
# stem (etA/imā/kā etc.). This is distinct from a pre-baked ?Ap tag on stems like
# dvi_s, where 7.2.102 must still fire (dvi → dva).
# The ?ajAdi arm formerly here has moved to 4.1.4.1 (prabalatva apavāda below)
# which additionally overrides every ṅīp sutra in the 4.1.5–4.1.21 cluster.
- sutra:  अजाद्यतष्टाप्
  domain: prakfti
  bahiranga: 2   # strīpratyaya selection = pratyaya substitution
  id: 4.1.4
  condition:
    l: at         # short-a-final only (sutra uses 'at' = one mātrā; ā-final excluded per Vasu)
    rp: ?strI_abs
  update:
     olp: +TAp_added
     orp: =Ap

# 454+: अजाद्यतष्टाप् (4-1-4) — ajādi-prabalatva apavāda, non-Dvigu cluster.
# When the stem (or compound) carries ?ajAdi, ṭāp wins over every ṅīp/ṅīṣ rule
# that the ajādi gaṇa's subgroups would otherwise invoke. Per SC Vasu's per-item
# N.B. notes on 4.1.4, the gaṇa's subgroups are exceptions to:
#   items 1–6  (jāti: aja/eḍaka/kokila/caṭaka/aśva/mūṣika) → 4.1.63 (SK518) ṅīṣ
#   items 7–12 (age: bāla/hoḍa/pāka/vatsa/manda/vilāta)    → 4.1.20 (SK478) ṅīp
#   items 13–14 (ḷyuṭ ṭiṭ: pūrvāpaharaṇa …)               → 4.1.15 (SK470) ṅīp
#   items 15–26 (phala/puṣpa-ending: saṃphala … ekapuṣpa) → 4.1.64 (SK519) ṅīṣ
# 4.1.6/4.1.16 are kept defensively (ugit/yañ ṅīp). 4.1.63/4.1.64 were ADDED so a
# stem that genuinely carries BOTH ?ajAdi and a jāti/pākādi tag (the faithful
# model — saṃphala IS phala-ending; kokila IS a jāti) gets ṭāp, not ṅīṣ: without
# them the higher-aps ṅīṣ rule (41063/41064 > 41004.1) wrongly won → संफली/कोकिली.
# The Dvigu (4.1.21) override is split into 4.1.4.2 below (gated on the narrower
# ?ajAdi_in_Dvigu tag) to honour Vasu's phala-subgroup distinction (Dvigu→ṭāp vs
# पञ्चाश्वी for the samāhāra-Dvigu of aśva). Variant id 4.1.4.1 (aps_num 41004.1),
# the "Subsutra/Vartikam" pattern parsed by sutra.py. ?ajAdi reaches a compound
# stem via the samāsa-gated propagation in paninian_object.join_objects.
- sutra: अजाद्यतष्टाप्
  domain: prakfti
  bahiranga: 2   # strīpratyaya selection = pratyaya substitution
  id: 4.1.4.1
  overrides: [4.1.6, 4.1.15, 4.1.16, 4.1.20, 4.1.63, 4.1.64]
  condition:
     - lp: ?ajAdi              # simple ajādi word (also its dvigu via ?ajAdi propagation)
       rp: ?strI_abs
     - lp:                     # samāsa-ajādi: detected by (pūrva@llp, uttara@lp) pair
         - and
         - ?samAsa
         - $$ajAdi_samasta
       rp: ?strI_abs
  update:
     olp: +TAp_added
     orp: =Ap

# 454++: अजाद्यतष्टाप् (4-1-4) — ajādi-prabalatva over 4.1.21 (Dvigu) only.
# Vasu on 4.1.4 (item 19–20 N.B.): "त्रिफला when a Dvigu Compound forms its
# feminine as त्रिफला; when a Bahuvrīhi Compound, its feminine is त्रिफली".
# Per the gaṇa structure (each item's N.B. names the specific ṅīp rule it
# overrides), the Dvigu override is explicitly licensed only for the phala
# subgroup (items 15–20), extended here to the puṣpa subgroup (21–26) by
# analogy. Other ajādi members (e.g. aśva, item 5) override 4.2.63 nish —
# which doesn't apply in Dvigu — so in Dvigu SK479 ṅīp wins for them
# (पञ्चाश्वी, per Vasu/SK on SK480 "समाहारे पञ्चाश्वी").
# Examples produced via ?ajAdi_in_Dvigu: त्रिफला (tri+Pala), त्र्यनीका
# (tri+anIka — anīka treated as phala-class by analogy though not strictly in
# the 34-item gaṇa).
- sutra: अजाद्यतष्टाप्
  domain: prakfti
  bahiranga: 2   # strīpratyaya selection = pratyaya substitution
  id: 4.1.4.2
  overrides: [4.1.21]
  condition:
     - lp: ?ajAdi_in_Dvigu     # simple ajādi word in Dvigu (anīka → tryanīkā)
       rp: ?strI_abs
     - lp:                     # phala/puṣpa samāsa-ajādi in Dvigu (tri+Pala → triphalā)
         - and
         - ?samAsa
         - $$ajAdi_in_Dvigu
       rp: ?strI_abs
  update:
     olp: +TAp_added
     orp: =Ap

# 480: अपरिमाणबिस्ताचितकम्बल्येभ्यो न तद्धितलुकि (4-1-22)
# Niṣedha to SK479 (4.1.21 द्विगोः): for an a-final Dvigu compound whose final
# taddhita has undergone luk (?luk_tadDita), ṅīp does NOT apply when the
# uttara-pada is NOT a parimāṇa word (?!parimARa), OR is one of बिस्त/आचित/
# कम्बल्य (?bistAdi). Selects ṭāp instead.
# ?!kARqa excludes kāṇḍa-final stems — SK481 (niyama) restricts the prohibition
# to the kṣetra sense for kāṇḍa, otherwise SK479 ṅīp wins (द्विकाण्डी रज्जुः).
# puruṣa-final stems are NOT excluded here: SK482 (vibhāṣā) optionally overrides
# this rule to re-enable ṅīp in the pramāṇa sense (द्विपुरुषी ~ द्विपुरुषा).
# Examples: पञ्चाश्वा, द्विबिस्ता, द्व्याचिता, द्विकम्बल्या; counters preserved:
# द्व्याढकी (?parimARa keeps SK479 ṅīp) and पञ्चाश्वी (samāhāra-Dvigu, no luk).
- sutra: अपरिमाणबिस्ताचितकम्बल्येभ्यो न तद्धितलुकि
