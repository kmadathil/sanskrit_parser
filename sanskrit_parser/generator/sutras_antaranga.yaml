# Ratva — pada-internal implementation (samAnapade = lp must be ?pada)
# 235: रषाभ्यां नो णः समानपदे (8-4-1)
# Direct adjacency: ṛ/ṣ/r immediately precedes 'n' (no intervening chars).
# Apavāda of 8.4.2: fires first when both conditions hold; 8.4.2 handles
# any remaining vyavāya 'n' positions in the subsequent iteration.
# xform: l:null + lc:ratva_string(lc+l) rewrites entire element string.
# Two parallel arms: Arm A excludes samasta_pada; Arm B uses samasta_Ratva_pada.
- sutra: रषाभ्यां नो णः समानपदे
  id: 8.4.1
  overrides: 8.4.2
  condition:
    - rp:
        - and
        - ?pada
        - $$has_ratva_simple
        - ?!merged_pada
    - rp:
        - and
        - ?pada
        - $$has_ratva_simple
        - ?samasta_Ratva_pada
  xform:
    r: null
    rc: ratva_string(r+rc)

# 197: अट्कुप्वाङ्नुम्व्यवायेऽपि (8-4-2)
# Vyavāya extension: ṛ/ṣ/r may be separated from 'n' by aṭkupvāṅnum chars
# (vowels, ku/pu-class, anusvara). lp: ?pada (samānapade). Subsumes old
# cross-boundary 8.4.2 and old 8.4.2.1 (which only checked lp-final 'n').
# Two parallel arms: Arm A excludes samasta_pada; Arm B uses samasta_Ratva_pada.
- sutra: अट्कुप्वाङ्नुम्व्यवायेऽपि
  id: 8.4.2
  condition:
    - rp:
        - and
        - ?pada
        - $$has_ratva_vyavaya
        - ?!merged_pada
    - rp:
        - and
        - ?pada
        - $$has_ratva_vyavaya
        - ?samasta_Ratva_pada
  xform:
    r: null
    rc: ratva_string(r+rc, True)

