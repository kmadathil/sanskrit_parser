# only when the user marks the members with that intent tag; without it the
# words stay separate (a different input, not a branch). Mechanics otherwise
# identical to the nitya block (single result).

# 666/2.1.12: अपपरिबहिरञ्चवः पञ्चम्या (2.1.12) — apa/pari/bahir/añcu + a noun in
