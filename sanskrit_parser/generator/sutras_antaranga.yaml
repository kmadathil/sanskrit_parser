# ════════════════════════════════════════════════════════════════════════════
# समासप्रकरणम् — बहुव्रीहिसमासः, Phase B2 (bahuvrihi_plan.md): additional formation
# types. Implemented: SK848/2.2.28 (saha) + SK849/6.3.82 (saha→sa) + SK850/6.3.83
