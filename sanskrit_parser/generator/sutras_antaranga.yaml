# 361: उगिदचां सर्वनामस्थानेऽधातोः (7-1-70)
# nUM insertion for ugit stems (u/ṛ/ḷ as it-marker) before sarvanamasthana.
# Multiple top-level condition blocks = OR alternatives (pattern from SK277 / 6.4.11).
# Covers: maGavan→maGavat (SK360 sets ++f, i.e. ṛ-it), bhavant (śatṛ is u-it),
#         and other ugit stems. kroṣṭu has ?tfc (ṛ is stem-final, NOT an it) → excluded.
# Also covers añc-type kvin stems (?aYc tag, āc clause of 7.1.70):
#   numAgama("pratyac")→"pratyanc" (dental n); then 8.3.24 n+c→M+c; then 8.4.58 M→Y → pratyaYc.
- sutra: उगिदचां सर्वनामस्थानेऽधातोः
  id: 7.1.70
#  domain: prakfti
#  bahiranga: 1
  condition:
   - lp:               # non-root ṛ-it stems (e.g., maghavat via SK360 ++f)
      - and
      - ?!DAtu
      - +f
     rp: ?sarvanAmasTAna
   - lp:               # non-root u-it stems (e.g., bhavant from śatṛ which is u-it)
      - and
      - ?!DAtu
      - +u
     rp: ?sarvanAmasTAna
   - lp:               # non-root ḷ-it stems
      - and
      - ?!DAtu
      - +x
     rp: ?sarvanAmasTAna
   - lp: ?aYc          # añc-type kvin stems (āc clause): prāñc, pratyañc, udañc, etc.
     rp: ?sarvanAmasTAna
  xform:
     lc: numAgama(lc+l)
     l: null

# 376: युजेरसमासे (7-1-71) — nasal (ñ) augment for non-compound yuj before sarvanamasthāna.
# Inserts palatal nasal Y (ñ=ञ) after stem vowel: yuj → yuñj in strong forms.
# Restriction (asaṃyoge): compound yuj (e.g. aśvayuk type) has no nUM — excluded by ?!samAsa.
# yuj_kvin (?yuj, no ?samAsa) → fires; yuj_kvin_samAsa (?yuj, ?samAsa) → blocked.
# Follows SK257 (1.4.8/1.4.8.1) pattern for pati compound vs non-compound.
# After num: yuñj+su → 8.2.23 deletes j (cluster Yj at pada-end) → yuY → 8.2.62 (Y→N) → yuṅ.
# Nom/acc du/pl: yuñj+O/jas → yuñjau, yuñjaḥ (no pada-end, no 8.2.23/8.2.62).
- sutra: युजेरसमासे
  id: 7.1.71
  condition:
     lp:
       - and
       - ?yuj
       - ?!samAsa    # non-compound only; compound yuj (aśvayuk type) uses ?samAsa tag to block nUM
     rp: ?sarvanAmasTAna
  xform:
     lc: lc+str("Y")

# 368: भस्य टेर्लोपः (7-1-88)
# ṭi-lopa for paTin-group (paTin/maTin/fBukzin) in bha position.
# ṭi = final vowel i + following consonant n = "in". Fires before vowel-initial
# non-sarvanamasthana suffixes: śas (acc pl), TA (inst sg), e (dat sg), as (abl/gen sg), etc.
# Result: paT (path-), maT (math-), fBukz (ṛbhukṣ-) + vowel suffix.
- sutra: भस्य टेर्लोपः
  id: 7.1.88
  condition:
     lp:
       - and
       - ?aNga
       - ?Ba
       - ?paTin
     l: n
     ll: i
  xform:
     lc: lc[:-1]
     l: null

# 367: थो न्थः (7-1-87)
# nth substituted for th (T in SLP1) in paTin/maTin before sarvanamasthana.
# Not applicable to fBukzin (no th/T in stem). Tag ?paTinTh restricts to paTin/maTin.
# APS 71087 > SK366 (71086): fires first; changes lc[-2] from T to nT.
- sutra: थो न्थः
  id: 7.1.87
  condition:
     lp: ?paTinTh
     rp: ?sarvanAmasTAna
  xform:
     lc: lc[:-2]+"n"+lc[-2:]

# 366: इतोऽत्सर्वनामस्थाने (7-1-86)
# a substituted for i of paTin-group (paTin/maTin/fBukzin) before sarvanamasthana.
# APS 71086 > 6.4.8 (60408): fires before upadhā-dīrgha.
# After SK367: lc[-1]='i' (for paTin/maTin post-ntha) or lc[-1]='i' (for fBukzin, no SK367).
# Note: l: n omitted — redundant given ?paTin tag; plain condition dict works fine.
- sutra: इतोऽत्सर्वनामस्थाने
  id: 7.1.86
  condition:
     lp: ?paTin
     rp: ?sarvanAmasTAna
  xform:
     lc: lc[:-1]+str("a")

# 365: पथिमथ्यृभुक्षामात् (7-1-85)
# ā substituted for final n of paTin-group before su (both nom and voc sg —
# no ?!sambudDi restriction; sūtra is unqualified, unlike 7.1.93 for sakhī).
# After SK366: lc[-1]='a' (from i→a), l='n'. This rule absorbs both into lc:
# lc[:-1]+ā replaces (lc[-1]='a' + l='n') → single long ā.
# Result: lc='panTĀ'/'manTĀ'/'fBukzĀ', l=null; +su(s) → 8.2.66 → visarga ('panTĀH').
# NOTE: 6.4.8 fires for nom/acc du/pl (SK365 not active for them), giving dīrgha there.
- sutra: पथिमथ्यृभुक्षामात्
  id: 7.1.85
  condition:
     lp: ?paTin
     rp: ?su
  xform:
     lc: lc[:-1]+str("A")
     l: null

