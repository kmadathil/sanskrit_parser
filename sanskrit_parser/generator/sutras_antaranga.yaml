       - ?aNga
       - ?Ba
       - ?SvanType
     l: n
     ll: a
  xform:
     lc: samprasArana_van(lc)
     # l (= n) unchanged

# 435: वसोः संप्रसारणम् (6-4-131)
# In bha position, v of the vasu/kvasu suffix undergoes samprasāraṇa (v→u).
# ṣatva applied simultaneously in xform: s→ṣ(z) since u(iṇ) now precedes the prātipadika-final s,
# but 8.3.59 ādeśapratyayoḥ wouldn't fire via a separate rule (s is prātipadika-final, not pratyaya).
# Gives: viduṣaḥ (gen sg), viduṣā (inst sg), viduṣe (dat sg), viduṣoḥ (gen/loc du), viduṣām (gen pl).
- sutra: वसोः संप्रसारणम्
  id: 6.4.131
  condition:
    lp:
      - and
      - ?aNga
      - ?Ba
      - ?vasanta
    l: s
    ll: a
  xform:
    lc: samprasArana_van(lc)
    l: str("z")    # s→ṣ (SLP1 z=ṣ): ṣatva since u (iṇ) now precedes s

# 363: न संप्रसारणे संप्रसारणम् (6-1-37) — DEFERRED
# Blocks a second samprasāraṇa from applying after a first has already been applied.
# Not needed for nominal declension: samprasArana_van() produces Su-/yU-/maGo- which
# contain no further yaṇ candidate, so no spurious re-application is possible.
# Relevant only for kṛt/verbal formations (e.g. UW-suffix compounds). Defer until then.

# 364: अर्वणस्त्रसावनञः (6-4-127)
# Mandatory tṛ-anta substitute for arvan (not preceded by nañ), before all suffixes
# except su (nominative singular). Parallel to SK360 (maGavan) but mandatory.
# ++f enables SK361 (7.1.70) to insert nUM before sarvanamasthana → arvant-forms.
# Before su: standard -an rules fire instead (6.4.8 upadhā-dīrgha + 8.2.7 n-lopa → arvā).
# nañ exception (anarvan → yajvan-type): not yet handled; requires nañ tag propagation.
- sutra: अर्वणस्त्रसावनञः
  id: 6.4.127
  domain: prakfti
  bahiranga: 1
  condition:
     lp:
      - and
      - ?aNga
      - ?arvan
     l: n
     ll: a
     rp: ?!su
  xform:
     l: str("t")
  update:
     olp:
      - ++f          # ṛ as it-marker; enables SK361 (7.1.70) nUM insertion

