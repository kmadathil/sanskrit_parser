    l: str("H")

# 404: युष्मदस्मदोः षष्ठीचतुर्थीद्वितीयास्थयोर्वांनावौ (8-1-20)
# Optional vAm/nO enclitic for yuzmad/asmad gen/dat/acc du.
# Vibhakti tags (propagated via paninian_object.py) disambiguate syncretic dual forms:
#   yuvAm = nom du (praTamA) + acc du (dvitIyA) → restrict to ?dvitIyA
#   yuvayor (pre-visarga) = gen du (zazWI) + loc du (saptamI) → restrict to ?zazWI
#   yuvAByAm = inst du (tftIyA) + dat du (caturTi) + abl du (pancamI) → restrict to ?caturTi
- sutra: युष्मदस्मदोः षष्ठीचतुर्थीद्वितीयास्थयोर्वांनावौ
  id: 8.1.20
  optional: true
  condition:
    - lp:
        - and
        - ?pada
        - =yuvAm
        - ?dvitIyA_pada
    - lp:
        - and
        - ?pada
        - =yuvayos
        - ?zazWI_pada
    - lp:
        - and
        - ?pada
        - =yuvAByAm
        - ?caturTi_pada
  xform:
    lc: str("vA")
    l: str("m")
# 404.1: asmad dual (AvAm/AvayoH/AvAByAm → nO)
