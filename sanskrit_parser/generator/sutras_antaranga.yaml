- sutra: बहुवचनस्य वस्नसौ
  id: 8.1.21.1
  optional: true
  condition:
    - lp:
        - and
        - ?pada
        - =asmAkam
    - lp:
        - and
        - ?pada
        - =asmaByam
    - lp:
        - and
        - ?pada
        - =asmAns
  xform:
