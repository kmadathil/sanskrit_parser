# ---- yuṣmad / asmad (personal pronoun) rules ----
# SK381: तदोः सः सावनन्त्ययोः (7-2-106) — tad-group pronoun; deferred (no tad pratipadika yet)

# 382: ङेप्रथमयोरम् (7-1-28)
# For yuṣmad/asmad: ṅe (dat sg "e") and prathamā (nom sg "s") → am.
# Fires on ?su (nom sg) and ?Ne (ṅit dat sg) after yuzmad/asmad.
# Priority (7.1.28, _aps_num=71028): fires after SK384 (72094) and SK385 (72090) when competing.
# NOTE: use block-sequence for ?-tag lists (flow-style [?tag] parses as dict in PyYAML).
- sutra: ङेप्रथमयोरम्
  id: 7.1.28
  bahiranga: 2
  overrides: 7.1.17
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    rp:
      - ?Ne
      - ?su
      - ?O
      - ?jas
      - ?am
      - ?Ow
      - ?Sas
  xform:
    r: null
    rc: str("am")
  update:
    orp:
      - +AdeSa
      - +am

# SK383: मपर्यन्तस्य (7-2-91) — adhikāra scope indicator ("up to m"); Natural Siddha:
# the "mparyanta" scope is encoded directly in SK384's xform (replacing lc = up to m).

# 384: त्वाहौ सौ (7-2-94)
# For yuṣmad/asmad, the mparyanta (up to-m portion) → tv / ah before su (nom sg).
# Two blocks: one for yuzmad (→ tv), one for asmad (→ ah).
# Priority 72094: fires before SK382 (71028) and SK385 (72090).
- sutra: त्वाहौ सौ
  id: 7.2.94
  overrides: 7.2.97
  condition:
    lp: ?yuzmad
    rp: ?su
  xform:
    lc: str("tv")

- sutra: त्वाहौ सौ
  id: 7.2.94.1
  overrides: 7.2.97
  condition:
    lp: ?asmad
    rp: ?su
  xform:
    lc: str("ah")

# 385: शेषे लोपः (7-2-90)
# Delete the final d of yuzmad/asmad in all vibhakti positions.
# SK393 (ā before hal) and SK392 (y before vowel) fire AFTER SK385 on the d-deleted stem.
- sutra: शेषे लोपः
  id: 7.2.90
  overrides: [7.3.102, 7.3.103]
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    l: d
  xform:
    l: null

# 386: युवावौ द्विवचने (7-2-92)
# Dual mparyanta: yuzmad → yuv, asmad → āv, for ALL dual vibhakti.
# Preserves trailing 'a' (lc[-1]) so SK393 can lengthen it to ā before hal suffixes,
# and SK392 can produce y-ādeśa before vowel suffixes.
# Priority 72092: fires before SK385 (72090) — but SK385 still fires after on l=d.
- sutra: युवावौ द्विवचने
  id: 7.2.92
  condition:
    lp: ?yuzmad
    rp: ?dvivacana
  xform:
    lc: str("yuv")+lc[-1]

- sutra: युवावौ द्विवचने
  id: 7.2.92.1
  condition:
    lp: ?asmad
    rp: ?dvivacana
  xform:
    lc: str("Av")+lc[-1]

# 387: प्रथमायाश्च द्विवचने भाषायाम् (7-2-88)
# Nom du suffix O (au) → ām in bhāṣā. Fires after SK386 changes stem to yuva/Āva.
# "yuva"+"Am" → sandhi a+ā=ā → yuvām ✓.
# overrides 7.2.89 (SK392) to block y-ādeśa from also firing for nom du (O is vowel-initial).
- sutra: प्रथमायाश्च द्विवचने भाषायाम्
  id: 7.2.88
  overrides: [7.2.89, 7.2.86]
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    rp:
      - and
      - ?praTamA
      - ?dvivacana
  xform:
      l: null
  insert:
      l: str("A")
  
    
# 388: यूयवयौ जसि (7-2-93)
# Nom pl mparyanta: yuzmad → yūy, asmad → vay, before jas.
# Drops trailing 'a' (like SK384): SK382 (patched to include ?jas) supplies the suffix 'am'.
# "yUy"+"am" = yūyam ✓. Priority 72093 > SK382 (71028), so SK388 fires first.
- sutra: यूयवयौ जसि
  id: 7.2.93
  condition:
    lp: ?yuzmad
    rp: ?jas
  xform:
    lc: str("yUya")

- sutra: यूयवयौ जसि
  id: 7.2.93.1
  condition:
    lp: ?asmad
    rp: ?jas
  xform:
    lc: str("vaya")

# 389: त्वमावेकवचने (7-2-97)
# All singular mparyanta: yuzmad → tv, asmad → m, for remaining singular vibhakti.
# PRESERVES trailing 'a' (lc[-1]): → "tva" / "ma". This is crucial so that:
#   - SK392 can fire on l='a' → 'ay' for vowel-initial suffixes (inst sg → tvayā etc.)
#   - SK393 can lengthen l='a' → 'ā' for hal-initial suffixes (loc pl → yuzmāsu etc.)
# Apavādas that override SK389 for specific cases:
#   - SK384 (7.2.94): overrides for nom sg → tvam/aham
#   - SK394 (7.2.95): overrides for dat sg → tubhyam/mahyam
#   - SK392 (7.2.89): overrides for vowel-initial suffixes → tvayā/mayā etc.
- sutra: त्वमावेकवचने
  id: 7.2.97
  condition:
    lp: ?yuzmad
    rp: ?ekavacana
  xform:
    lc: str("tva")
    l: null
  insert:
    l: lc[-1]+l

- sutra: त्वमावेकवचने
  id: 7.2.97.1
  condition:
    lp: ?asmad
    rp: ?ekavacana
  xform:
    lc: str("ma")
    l: null
  insert:
    l: lc[-1]+l

# 390: द्वितीयायां च (7-2-87)
# Acc ā-ādeśa: suffix → ām for acc sg (am) and acc du (Ow). Gives tvām, mām, yuvām, āvām.
# After SK389+SK385: s1="tva"; SK390: "am"→"Am"; "tva"+"Am" → sandhi → tvām ✓.
# overrides 7.2.89 (SK392) to prevent y-ādeśa from also firing on the acc vowel-initial suffix.
- sutra: द्वितीयायां च
  id: 7.2.87
  overrides: 7.2.89
  condition:
    lp:
      - ?yuzmad
      - ?asmad
    rp:
      - and
      - ?dvitIyA
  xform:
    l: null
  insert:
    l: str("A")


# 391: शसो न (7-1-29)
# Acc pl: śas → n for yuzmad/asmad. After SK391 changes suffix to "n" (consonant),
# the engine re-evaluates: SK393 now fires (l='a', r='n'=hal) → "yuzmA"+"n" = yuzmān ✓.
- sutra: शसो न
  id: 7.1.29
  bahiranga: 2
  overrides: 7.1.28
